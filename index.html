  b.innerHTML=books().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")+'<option value="__NEW__">＋ 새로운 책</option>';
  if(current && [...b.options].some(o=>o.value===current))b.value=current;
  b.onchange=()=>document.getElementById("newBook").style.display=b.value==="__NEW__"?"block":"none";
}
function save(){localStorage.setItem(KEY,JSON.stringify(DATA))}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let arr=DATA.map((x,i)=>({...x,_i:i}));
  if(selected!=="전체")arr=arr.filter(x=>x.book===selected);
  if(q)arr=arr.filter(x=>(x.word+" "+x.meaning+" "+x.example+" "+x.book).toLowerCase().includes(q));
  if(sort==="word")arr.sort((a,b)=>a.word.localeCompare(b.word,"ko"));
  const grid=document.getElementById("grid");
  document.getElementById("count").textContent=`총 ${arr.length}개`;
  if(!arr.length){grid.innerHTML='<div class="empty">조건에 맞는 어휘가 없어요.</div>';return}
  grid.innerHTML=arr.map(x=>`
    <div class="card">
      <div class="top">
        <div><div class="word">${esc(x.word)}</div><div class="book">📖 ${esc(x.book)}</div></div>
        <div class="actions"><button onclick="editEntry(${x._i})">✏️ 수정</button><button onclick="deleteEntry(${x._i})">삭제</button></div>
      </div>
      <div class="meaning">${esc(x.meaning)}</div>
      ${x.example?`<div class="example" id="ex${x._i}">💬 ${esc(x.example)}</div><button style="margin-top:8px" onclick="document.getElementById('ex${x._i}').classList.toggle('show')">💬 예문 보기</button>`:""}
      ${x.note?`<div class="note">${esc(x.note)}</div>`:""}
    </div>`).join("");
}
function openModal(i=-1){
  editing=i; renderBooks();
  document.getElementById("modalTitle").textContent=i<0?"어휘 추가":"어휘 수정";
  const x=i<0?{book:selected!=="전체"?selected:books()[0]||"",word:"",meaning:"",example:"",note:""}:DATA[i];
  document.getElementById("book").value=x.book;
  document.getElementById("newBook").style.display="none";
  document.getElementById("word").value=x.word;document.getElementById("meaning").value=x.meaning;document.getElementById("example").value=x.example||"";document.getElementById("note").value=x.note||"";
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show")}
function editEntry(i){openModal(i)}
function deleteEntry(i){if(confirm(`「${DATA[i].word}」을(를) 삭제할까요?`)){DATA.splice(i,1);save();renderBooks();render()}}
document.getElementById("addBtn").onclick=()=>openModal();
document.getElementById("cancel").onclick=closeModal;
document.getElementById("save").onclick=()=>{
  const b=document.getElementById("book").value==="__NEW__"?document.getElementById("newBook").value.trim():document.getElementById("book").value;
  const x={book:b,word:document.getElementById("word").value.trim(),meaning:document.getElementById("meaning").value.trim(),example:document.getElementById("example").value.trim(),note:document.getElementById("note").value.trim()};
  if(!x.book||!x.word||!x.meaning){alert("책, 단어, 뜻은 꼭 입력해 주세요.");return}
  if(editing<0)DATA.push(x);else DATA[editing]=x;save();closeModal();renderBooks();render();
};
document.getElementById("bookSelect").onchange=e=>{selected=e.target.value;render()};
document.getElementById("search").oninput=render;
document.getElementById("sort").onchange=render;

document.getElementById("backupBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:DATA},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="나만의_문학_어휘장_백업.json";a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result),a=Array.isArray(p)?p:p.data;if(!Array.isArray(a))throw 0;DATA=a;save();selected="전체";renderBooks();render();alert(`총 ${DATA.length}개를 복원했어요!`)}catch(_){alert("백업 파일을 읽지 못했어요.")}e.target.value=""};r.readAsText(f,"utf-8");
};

document.getElementById("updateBtn").onclick=()=>{document.getElementById("updateBox").style.display="block";document.getElementById("updateCode").focus()};
document.getElementById("closeUpdate").onclick=()=>document.getElementById("updateBox").style.display="none";
document.getElementById("applyUpdate").onclick=()=>{
  const raw=document.getElementById("updateCode").value.trim(); if(!raw)return alert("업데이트 코드를 붙여넣어 주세요.");
  try{
    let add;
    try{add=JSON.parse(raw)}catch(e){add=JSON.parse(decodeURIComponent(escape(atob(raw))))}
    if(!Array.isArray(add))throw 0;
    const map=new Map(DATA.map(x=>[key(x),{...x}]));
    let added=0;
    add.forEach(x=>{if(!x||!x.book||!x.word||!x.meaning)throw 0; if(!map.has(key(x)))added++; map.set(key(x),{book:x.book,word:x.word,meaning:x.meaning,example:x.example||"",note:x.note||""})});
    DATA=[...map.values()];save();selected="전체";renderBooks();render();document.getElementById("updateCode").value="";document.getElementById("updateBox").style.display="none";
    alert(`업데이트 완료! 새로 추가된 어휘 ${added}개\n현재 총 ${DATA.length}개`);
  }catch(e){alert("업데이트 코드를 읽지 못했어요. 내가 보내준 코드인지 확인해 주세요.")}
};

renderBooks();render();
</script>
</body></html>
