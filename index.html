<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<title>📚 나만의 문학 어휘장</title>
<style>
:root{--bg:#fffaf7;--card:#fff;--ink:#2d2926;--muted:#7b716b;--line:#eadfd8;--accent:#e97b65;--accent2:#f5eee9}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 16px 60px}
h1{font-size:25px;margin:6px 0 16px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.controls{display:grid;grid-template-columns:1fr 180px 150px;gap:8px;margin-bottom:12px}
input,select,textarea,button{font:inherit} input,select,textarea{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--ink)}
button{border:0;border-radius:12px;padding:10px 13px;background:var(--accent2);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.count{color:var(--muted);font-size:13px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin:9px 0;box-shadow:0 2px 8px #00000008}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.word{font-size:19px;font-weight:750}.book{font-size:12px;color:var(--accent);margin-top:3px}.meaning{margin-top:8px;line-height:1.55}.example{display:none;margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;line-height:1.55;font-size:14px}.example.show{display:block}.note{color:var(--muted);font-size:12px;margin-top:7px}.actions{display:flex;gap:5px}.actions button{padding:7px 9px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px;align-items:center;justify-content:center}.modalbg.show{display:flex}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.modal h2{margin:0 0 14px;font-size:20px}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:5px;color:var(--muted)}.field input,.field select,.field textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.updatebox{margin:14px 0;padding:14px;border:1px solid #ead4cc;border-radius:16px;background:#fff4ef}.updatebox h3{margin:0 0 6px;font-size:16px}.updatebox p{margin:5px 0 10px;font-size:13px;color:var(--muted);line-height:1.5}
@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.wrap{padding:16px 12px 50px}.top{gap:8px}.word{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 나만의 문학 어휘장</h1>
  <div class="sub">공책에 적은 어휘를 사진으로 보내주면, 업데이트 코드를 만들어줄게요.</div>

  <div class="controls">
    <input id="search" placeholder="단어 또는 뜻 검색">
    <select id="bookSelect"></select>
    <select id="sort"><option value="word">가나다순</option><option value="added">추가한 순서</option></select>
  </div>

  <div class="toolbar">
    <button class="primary" id="addBtn">＋ 어휘 추가</button>
    <button id="updateBtn">⚡ 업데이트 코드</button>
    <button id="backupBtn">💾 백업</button>
    <button id="restoreBtn">📂 복원</button>
    <input id="restoreFile" type="file" accept=".json,application/json" hidden>
  </div>

  <div class="updatebox" id="updateBox" style="display:none">
    <h3>⚡ 새 어휘 업데이트</h3>
    <p>내가 보내준 <b>업데이트 코드</b>를 아래에 붙여넣고 적용하세요. 기존 어휘는 유지되고 새 어휘만 추가됩니다.</p>
    <textarea id="updateCode" rows="6" placeholder="여기에 업데이트 코드를 붙여넣으세요."></textarea>
    <div class="toolbar" style="margin:8px 0 0">
      <button class="primary" id="applyUpdate">업데이트 적용</button>
      <button id="closeUpdate">닫기</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="grid"></div>
</div>

<div class="modalbg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">어휘 추가</h2>
    <div class="field"><label>책</label><select id="book"></select><input id="newBook" placeholder="새로운 책 이름" style="display:none;margin-top:7px"></div>
    <div class="field"><label>단어</label><input id="word"></div>
    <div class="field"><label>뜻</label><textarea id="meaning" rows="3"></textarea></div>
    <div class="field"><label>예문</label><textarea id="example" rows="3"></textarea></div>
    <div class="field"><label>메모 / 페이지</label><input id="note" placeholder="예: p.123"></div>
    <div class="modal-actions"><button id="cancel">취소</button><button class="primary" id="save">저장</button></div>
  </div>
</div>

<script>
const DEFAULT_DATA = [{"book":"그 많던 싱아는 누가 다 먹었을까","word":"여북하다","meaning":"정도가 매우 심하거나 상황이 좋지 않다. ‘얼마나’, ‘오죽’","example":"어른들이 아이들을 싸잡아서 코흘리개라고 부른 것만 봐도 알 수가 있다. 여북해야 내가 엄마가 되고 나서 내 아이들에 대해 제일 이상하게 생각한 것은, 감기가 들지 않고는 절대로 코를 안 흘린다는 것이었다.","note":"p.13"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"더께","meaning":"몹시 찌든 물건에 앉은 거친 때","example":"그래서 한겨울을 나고 나면 소매부리에 고약이 엉겨 붙은 것처럼 새카만 더께가 앉았다.","note":"p.14"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"두덩산같이","meaning":"물건이 많이 쌓여 수북하게","note":"","example":"두덩산같이 솜을 둔 저고리 하나면 겨울을 났다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"산모롱이","meaning":"산모퉁이의 휘어 돌아간 곳","example":"그 가운데 기둥을 한 팔쯤 안고 엄마 없으면 동구 바로 난 단굿길 건너 저 멀리 산모롱이로 아스라히 사라지는 지점까지 바라볼 수가 있었다.","note":"p.19"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"황황히","meaning":"갈팡질팡 어쩔 줄 모를 정도로 급하게","example":"누군가 지나가던 사람이 연등을 해서 식구들이 우르르 황황히 달려 나가 할아버지를 간신히 사람들에게 내줬다.","note":"p.21"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"급급하다","meaning":"약점이 잡혀 기를 펴지 못하다","note":"","example":"엄마를 괴롭히기만 여기던 어른들의 마음도 많이 누그러진 것 같다. 그런 녹고적적하기보다는 곧 잡히고 있는 건지도 몰랐다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"궁추먹","meaning":"판독 확인 필요","note":"","example":""},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"허위댐심","meaning":"허우적거리며 무척 애를 씀","note":"","example":"허위댐심 꼭대기까지 올라갔는데도 동네는 계속 됐다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"성급스럽다","meaning":"하는 일이나 행동 따위가 뜻밖이고 갑작스럽다","note":"","example":"천 년을 내려온 것처럼 안정된 구조의 익숙해진 나의 심미안이 그야말로 고약한 권력으로 처벌을 받는다는 너무도 성급스러웠다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"일손에 부치다","meaning":"대수롭지 않게 여겨 무시해 버리다","note":"","example":"서울 갈 날이 임박해서 엄마는 나를 데리고 그 길을 답사하면서 문득문득 대해 세상에 떠도는 끔찍한 말을 일손에 부쳤다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"손재수","meaning":"돈이나 값나가는 물건을 잃을 운수","example":"엄마가 아까워하면서 퍼 준 세숫물이 만약 내 실수로 최종 단계까지 못 가고 찍 버려지기라도 하면 엄마는 중대한 손재수라도 당한 것처럼 허를 치곤 했다.","note":"p.65"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"강퍅하다","meaning":"입은 옷이 아랫도리가 드러날 정도로 짧다","note":"","example":"예방장하고 강퍅한 양복으로 차려 입은 애가 대부분이었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"주눅나다","meaning":"어떤 일에 관계없는 사람이 불쑥 참견하며 나서는 것이 주제넘다","note":"","example":"삼박지 넘어 운운이 있는 학교에 다니는 주눅난 사람들끼리 이러했습니다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"무꾸리","meaning":"무당이나 점쟁이에게 앞으로의 좋은 일과 나쁜 일에 대하여 점을 치는 일","example":"남편들이 장사하러 외지에 나가 있는 집이 많기 때문에 무꾸리들도 잘 다녔다.","note":"p.93"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"노느매기","meaning":"여러 몫으로 갈라 나누는 일","example":"큰 굿이 들었을 때는 구경꾼에게 어른 아이 가리지 않고 떡이나 알록달록한 색사탕 같은 걸 노느매기해 줄 때도 있었다.","note":"p.96"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"소궁","meaning":"푸성귀만 너무 먹어서 고기가 먹고 싶은 증세","note":"","example":"그렇지만 어떡해 소궁 난다고 궁둥거리 사이 돈을 꿔 달라는 것이다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"반지빠르다","meaning":"어중간하여 알맞지 아니하다","example":"어쩌나 반지빠른 자투리땅에다 지은 집인지 명색만 있는 마당은 삼각형이었고 축대가 높았다.","note":"p.131"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"귀간스럽다","meaning":"마구 뒤섞여 정신이 어수선하다","note":"판독 확인 필요","example":"과연 몇 년 마을을 넓고 닦고 5대박하고 나니 흰털 집 줄이 되어 가지만 어머니가 왜 오직 뼈대 하나만 보고 그 귀간스러운 집을 싸가를 이해한 것은 나중이었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"삼삼하다","meaning":"잊히지 않고 눈앞에 보이는 듯 또렷하다","example":"오랫동안 만화 속의 그림이 눈에 삼삼하고 다음 줄거리가 궁금해서 어디 가서 훔칠 수 있는 거리면 훔쳐서라도 마저 보고 싶었다.","note":"p.138"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"시척지근하다","meaning":"음식이 쉬어서 비위에 거슬릴 정도로 맛이나 냄새 따위가 시다","example":"방학이 가까워 오면 할아버지의 침에 젖어 시척지근한 냄새가 밴 베수건에 싸 둔 곳이나 밤 따위가 다 절절히 그리워지곤 했다.","note":"p.139"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"움막하다","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"이왕에 운동장에서 조회를 할 때 미나 황국신민의 맹세를 하고 나서 군악대가 밭을 맞춰 교정에 들어갈 때면 괜히 피가 뜨거워지는 듯해서 무슨 움막한 할 것 같은 불쾌한 정경이었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"객쩍다","meaning":"행동이나 말 따위가 쓸데없고 싱겁다","example":"엄마는 엄마대로 생전 어른 속이라고는 썩일 줄 모르던 오빠가 왜 별안간 객쩍은 자기주장을 하게 되었는지 모르겠다고 걱정이 이만저만이 아니었다.","note":"p.151"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"처러지","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"그 아이는 나래 나는 처러지와 다름이 없었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"충충하다","meaning":"맑거나 산뜻하지 못하고 흐리다","example":"안에 충충하게 고여 있는 어둡고 서늘한 정적을 훔쳐보는 것조차 두려워서 가슴을 졸이며 열려 있는 문을 이 문 저 문 조심스럽게 엿보고 다니는데 정복을 입은 수위가 달려왔다.","note":""},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"어기어기","meaning":"음식을 입 안에 넣고 마구 씹어 먹는 모양","note":"","example":"어물 보따리 등 짐이 많았고 바가지가 울렁울렁 매달린 보따리가 기다려 코는 노인네가 없다 하면 개떡이나 조밥 따위를 떨쳐 놓고 어기어기 먹는 아이들도 있었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"사매질","meaning":"권력이 있는 자가 사사로이 사람을 때리는 것","example":"열서너 살밖에 안 된 계집애들이 마구 보고 서서 서로의 증오심을 무진장 상승시켜가며 꽃 같은 뺨이 시뻘겋게 부풀어 오르도록 사매질을 하는 광경을.","note":"p.165"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"애매꼴면","meaning":"몹시 힘이 겨운 일을 이루려고 갖은 애를 쓰는 모양","note":"판독 확인 필요","example":"서울에 애매꼴면 말뚝을 박은 일이면 외아들이 대빵 기다려 자장미 운동 허망한 눈시였다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"콩방이","meaning":"작은 바구니","note":"","example":"낚시질을 하는 게 아니라 그물을 던져서 잡았는데 숙박과 곤충을 던지고 어깨에 그물을 메면 나는 우리 콩방이를 들고 신이 나서 따라나섰다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"나뭇돌","meaning":"나무를 베어 내고 남은 밑동","note":"","example":"가끔 재수 내뱉기 물속에 잠겨 있던 나뭇돌 같은 것이 그물이 걸려 숙박가 해엄쳐 들어가 젖던 그물을 가져오고 배울 적도 있었지만, 아주 가끔이고 하지만 망청가가 잡힐 적도 없었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"우지무득","meaning":"크고 단단한 물건이 요란스럽게 부딪치거나 부서지며 다른 물체와 부딪치는 소리","note":"판독 확인 필요","example":"그들은 저희들끼리 희희낙락 우물물에서 우지무득 우리 집 세네번 고무줄을 매려 부수기 시작했다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"뒤미처","meaning":"그 뒤에 곧 잇따라","example":"셋방을 얻어 임시 거처를 마련했던 작은 숙부네는 거칠 것이 없어 오빠 뒤미처 서울로 떠났다.","note":"p.204"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"구게구게","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"그리고 구게구게 나오니 그저 한약 생약 등 약 보따리였다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"흔늑흔늑","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"그 여자 앞에서 숙녀는 딴사람처럼 흔늑흔늑해 보이고 숙녀 자신이 그 끝이 된 걸 부끄러워하기보다는 즐거워하는 것 같았다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"굴","meaning":"한쪽으로 트여 나가는 방향이나 길","note":"","example":"오빠는 바로 저 굴을 찾은 거였다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"걸다","meaning":"흙이나 거름 따위가 기름지고 양분이 많다","example":"땅이 어쩌면 이렇게 거냐?","note":"p.261"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"아비다리","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"꺾은 지 얼마 안 되는 아비다리의 경령이 미뤄져 다행히 이기적인 생각을 하고만 경령이 난 속을 사고 가릴 참 잘 참았다고 아비다리를 피우면서 살 수 있을만한 희망의 기적이 없었다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"간단없다","meaning":"계속하거나 이어져 있던 것이 끊이지 아니하다","example":"귀갓길은 시시각각으로 촉박한 전운이 감돌고 있었고, 간단없는 포 소리에 행인들은 무작정 우왕좌왕하고 있는 것처럼 보였다.","note":"p.267"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"약비내다","meaning":"정도가 너무 지나쳐서 진저리가 날 만큼 싫증이 나다","note":"","example":"소를 통째로 잡아다가 각을 떠서 땀 부쳐놓고 나누고 했지만 한 이틀 약비내기 고기로만 배를 불린 적도 있다고 했다."},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"흡흡하다","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"먹는 것이 흡흡한리 가장 좋지 못한 일로 교육받아 온 우리는 남에게 그런 혐의를 받는다고 생각하는 것만으로도 소름이 끼쳤다."},{"book":"그 산이 정말 거기에 있었을까","word":"아귀다툼","meaning":"서로 악과 기를 쓰며 헐뜯고 사납게 다툼","example":"아침에도 그 아귀다툼 같은 굉장한 식탁에서 슬쩍 비켜날 수가 있었다.","note":"p.150"},{"book":"그 산이 정말 거기에 있었을까","word":"들까부르다","meaning":"위아래로 심하게 흔들다","example":"그까짓 쭉정이들 이제 곧 그만 들까불리고 싶었다.","note":"p.155"},{"book":"그 산이 정말 거기에 있었을까","word":"치지도리","meaning":"마음에 들지 아니함","note":"판독 확인 필요","example":"우리는 남쪽에 아무도 아는 사람이 없고 가진 돈도 없다. 오빠의 건강 상태는 겨울보다는 많이 좋아졌다고 해도 먼 길을 갈 만하지 않아, 또 먹어보니 북쪽 정착도 남쪽 정착도 얼마 남지 않은 폭죽들을 겁시보다 철저하게 치지도리하는 경향이더라."},{"book":"그 산이 정말 거기에 있었을까","word":"음전","meaning":"말이나 행동이 곱고 우아함","example":"우리가 모질어서가 아니라 건강하고 음전한 여자와 재혼해서 자식 낳고 원만하게 사는 걸 지켜보는 시집 식구로서의 의무였다.","note":"p.159"},{"book":"그 산이 정말 거기에 있었을까","word":"더리다","meaning":"격에 맞지 않아 마음에 달갑지 않다","example":"오빠가 유아적인 더림을 뚝뚝 떠는 것 같아 닭살이 돋으려고 했다.","note":"p.159"},{"book":"그 산이 정말 거기에 있었을까","word":"종","meaning":"병을 앓을 때 나타나는 여러 가지 상태나 모양","note":"","example":"제 종이 아니야."},{"book":"그 산이 정말 거기에 있었을까","word":"요염하다","meaning":"맵시가 있고 날씬하다","note":"","example":"그가 여자의 얼굴에 피어나는 늙씨 같은 요염한 것만 보고 그 앞이 반짝하는 고약한 며칠에는 놀란 것처럼 사랑하고, 그녀의 처녀 같고 금방 같은 씨살갱이 되며 거기로 상처를 가할 때 거기서 더더욱 청순해하며 살던 처녀."},{"book":"그 산이 정말 거기에 있었을까","word":"오물","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"허병이나 강한 힘이 감히 같은 것은 향해 피난문을 개방한 적이 오물에 쉬어 아무거나 그런다는 기억이다."},{"book":"그 산이 정말 거기에 있었을까","word":"드세다","meaning":"길을 가다가 잠시 쉬려 만한 곳에 들다 / 밥을 짓다","note":"판독 확인 필요","example":"그런 상황도 겪어야 피난민들을 방이 차 있어서 가까스로 거처를 깔고 드세할 수 있는 것밖에 못 되었다."},{"book":"그 산이 정말 거기에 있었을까","word":"선하품","meaning":"몸에 이상이 있거나 흥이 없는 일을 할 때 나오는 하품","example":"자고 깨니 어젯밤, 남자들은 흉흉한 마을 소문 때문에 교대로 보초를 섰노라고 하면서 연방 선하품들을 했다.","note":"p.167"},{"book":"그 산이 정말 거기에 있었을까","word":"법장광인이","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"만약 그들이 그런 목적으로 들어가시면 어쩔 수 없다고 했더니, 감칠지 비고 늦는 힘이 있더라도 이 법장광인이 같은 남자 속 명예 여자들을 감지 못하겠냐고 한다."},{"book":"그 산이 정말 거기에 있었을까","word":"땅꾼","meaning":"뱀을 잡아 파는 것을 직업으로 하는 사람","example":"근숙이 언니는 며칠 안 있어 그 잡이 땅꾼 집이라는 건 알아냈다.","note":"p.168"},{"book":"그 산이 정말 거기에 있었을까","word":"단애","meaning":"깎아 세운 듯한 낭떠러지","example":"부엌과 안방과 윗방과 헛간과 또 방 한 칸이 일자로 나란히 붙은 그 일자집은 툭 터진 마을을 등지고, 답답하게도 골목만한 공간을 사이에 두고 시뻘건 단애를 드러내고 직립해 있는 동산에이 면하고 있었다.","note":"p.168"},{"book":"그 산이 정말 거기에 있었을까","word":"구스로","meaning":"자기 주제에 맞게","note":"판독 확인 필요","example":"나도 따라 나서고 싶었지만 당장에 여기는 것 같지 않아 구스로 기만에 있기로 했다."},{"book":"그 산이 정말 거기에 있었을까","word":"골탕","meaning":"속을 태우는 걱정","note":"","example":"속으로 골탕을 하던 게 하도 싫게 하려던 게라 꼭 뒤에서 다시 눌러 세울 것만 같아 나는 저쪽 앞으로 고꾸라지고 있는 놈팽을 있는 대로 다 떨어져 여울 과자이고 있었다."},{"book":"그 산이 정말 거기에 있었을까","word":"사북재간","meaning":"거리낌 없이 욕설이나 상말을 마구 하는 입이 더러운 사람","note":"판독 확인 필요","example":"보아이나 입이 사북재간 같은 것들한테는 입이 천근 같은 노인 각별히가 오죽해야 그 짓을 했겠냐."},{"book":"그 산이 정말 거기에 있었을까","word":"고적하다","meaning":"외롭고 쓸쓸하다","example":"이 고적한 타향에서 우리 근본을 알아주는 이를 만났으니.","note":"p.183"},{"book":"그 산이 정말 거기에 있었을까","word":"취하다","meaning":"무서운 느낌이 들 정도로 쓸쓸하고 고요하다","note":"판독 확인 필요","example":"전쟁 세 살던 사람 공원 피난 갔다 돌아온 집도 있어서 그 큰 집에 축히 언니 혼자 있어도 별로 호쾌해 보이지 않았다."},{"book":"그 산이 정말 거기에 있었을까","word":"부란","meaning":"썩어 문드러짐","example":"엄마가 먼저 맡은 부란의 냄새는 역질처럼 무섭게 우리한테 번졌다.","note":"p.202"},{"book":"그 산이 정말 거기에 있었을까","word":"역질","meaning":"‘천연두’를 한방에서 이르는 말","example":"엄마가 먼저 맡은 부란의 냄새는 역질처럼 무섭게 우리한테 번졌다.","note":"p.202"},{"book":"그 산이 정말 거기에 있었을까","word":"갈창하다","meaning":"감회를 잡아서 분명하게 정하다","note":"판독 확인 필요","example":"도망시장의 순서 냄새와 끈끈한 냄새가 뒤섞인 냄새, 그 냄새에 오장이 뒤틀리는 듯한 식욕을 억지 못해 지친 짐승처럼 전기 없이 번들대는 놀라 어두컴컴한 얼굴로 두 가지 음식의 영양가와 복도와 주머니 사정을 맞춤을 신출해 내느라 발뺌을 갈창 못 하는 막발만큼."},{"book":"그 산이 정말 거기에 있었을까","word":"입정","meaning":"음식을 먹거나 말을 하기 위하여 놀리는 입","example":"그런 것들 사이를 놀이터 삼아 요리조리 싸다니다 운수 좋아 남의 걸 슬쩍해서 입정질해도 야단맞지 않는 장돌뱅이 새끼들.","note":"p.217"},{"book":"그 산이 정말 거기에 있었을까","word":"누풍","meaning":"낯빛이 곱고 보드라우며 잘 꾸며지지 아니하는 명주로 짠 옷감","note":"판독 확인 필요","example":"허 사장인 듯한 사람도 최 안 돼 보이는 순수 좋은 남자가 명주 바지저고리 차림으로 내 나이 또래밖에 안 돼 보이는 피박가 고운 여자와 함께 아무쑥에 깔아 놓은 누풍 뜯어가며 밀어 넣고 입은 처 우리를 맞았다."},{"book":"그 산이 정말 거기에 있었을까","word":"무두질","meaning":"생가죽, 실 따위를 매만져서 부드럽게 만드는 일","example":"엄마에게나 나에게나 온몸을 내던진 울음은 앞으로 부드럽게 살기 위해 꼭 필요한 통과의례, 자신에게 가하는 무두질 같은 게 아니었을까.","note":"p.350"},{"book":"그 산이 정말 거기에 있었을까","word":"공구","meaning":"몹시 두려움","note":"","example":"엄마는 나를 볼 줄 알았는데 곧 상황하게 떠오른 표정은 무척을 탄 것처럼 공구하고 거리는 기색이었다."},{"book":"그 산이 정말 거기에 있었을까","word":"내남없이","meaning":"나와 다른 사람이나 모두 마찬가지로","note":"","example":"내남없이 어김없이 가슴에서 목구멍까지 벅차올랐다."},{"book":"그 산이 정말 거기에 있었을까","word":"질겁","meaning":"몹시 놀라거나 겁이 나서 갑자기 숨이 막힘","note":"","example":"수북이 되고나서 밥이 나온 엄마를 보고 어쩔 사람이 질겁을 하더라는 것이었다."},{"book":"그 산이 정말 거기에 있었을까","word":"서리서리","meaning":"감정 따위가 매우 복잡하게 얽혀 있는 모양","note":"","example":"의사가 시방으로 고통한 중간에서 피 묻은 침을 뱉고, 소독할 심은 서리서리 한참에 집병촌을 젖은 앞에서 지켜보면서 나는 그 구렁이 지옥을 통하는 너락골이나 어둠을 깊게 느끼었고, 그 안으로 하염없이 빨려 들어가는 듯한 공포감을 맛보았다."},{"book":"그 산이 정말 거기에 있었을까","word":"거듭내기","meaning":"서로 번갈아 하기","note":"","example":"우리가 지금 보고 있는 하늘이 대한민국의 하늘인지 인민공화국의 하늘인지 알아보기 위해 우리는 다시 거듭내기로 내렸다."},{"book":"그 산이 정말 거기에 있었을까","word":"불귀객","meaning":"하늘을 함께 이지 못한다는 뜻으로, 이 세상에서 같이 살 수 없을 만큼 큰 원한을 가짐을 비유적으로 이르는 말","note":"","example":"불귀객의 원숭끼리 서로 필사의 총질을 거듭고 마주 대사한 한가운데 있는 보이지 않는 선을 돌파하기로 운명이 흘러가지 않으면 불귀한 길이다."},{"book":"그 산이 정말 거기에 있었을까","word":"망망하다","meaning":"어렴풋하고 아득하다","example":"인해전술란 말에 딱 들어맞는, 막강하기보다는 망망한 병력이었다.","note":"p.17"},{"book":"그 산이 정말 거기에 있었을까","word":"연도","meaning":"큰 도로 좌우에 연하여 있는 곳","example":"우리 말고도 연도에 드문드문 사람들의 모습이 보이는 게 반갑고도 신기했다.","note":"p.18"},{"book":"그 산이 정말 거기에 있었을까","word":"횡허케","meaning":"‘휭허니’를 예스럽게 이르는 말","example":"앞장선 올케는 힁허케 더 높은 비탈 쪽으로 향했다.","note":"p.38"},{"book":"그 산이 정말 거기에 있었을까","word":"개부라지다","meaning":"기운이 빠져 몸이 고부라지거나 생각 없이 나른해지다","note":"판독 확인 필요","example":"찟기라고 없는 오빠의 기력이라고 생각할 모습은 가슴에 귀를 대고 싶은 충동을 일으킬 정도로 산란한 같지 않았다."},{"book":"그 산이 정말 거기에 있었을까","word":"모반","meaning":"배반을 꾀함","example":"나는 몰래몰래 모반을 꿈꾸었지만 돌파구는 없었다.","note":"p.42"},{"book":"그 산이 정말 거기에 있었을까","word":"어트다","meaning":"돈이나 물건을 아껴 쓰고 나머지를 모아 두다","note":"","example":"그래도 우리는 그동안 열심히 어트려 놓은 게 있어서 그나마 다행이었다."},{"book":"그 산이 정말 거기에 있었을까","word":"달포","meaning":"한 달이 조금 넘는 기간","example":"일사후퇴 후 달포가 되면서 각자의 자리에서 죽은 듯이 움츠리고 있던 사람 사는 모습이 별수 없이 그 모습을 드러내기 시작했다.","note":"p.47"},{"book":"그 산이 정말 거기에 있었을까","word":"여염집","meaning":"일반 백성의 살림집","example":"여염집이었지만 동 인민위원회 간판도 그럴싸하게 붙였고, 마루에는 책상 걸상도 마련하고 난로도 놓고 기름종이을 긁어서 잉크로 미는 등 사판까지 어디서 한 대 갖다 놓아 그런대로 인민위원회다운 구색을 갖춰 갔지만 그중 가장 안 어울리는 게 위원장이었다.","note":"p.50"},{"book":"그 산이 정말 거기에 있었을까","word":"조하나다","meaning":"성질이 거칠고 딱딱하다","note":"판독 확인 필요","example":"그게 되려 우리처럼 식구라는 끈끈하게, 남한테는 조하 즉석에서는 편했다."},{"book":"그 산이 정말 거기에 있었을까","word":"무인지경","meaning":"사람이 살고 있지 않는 외진 곳","example":"무인지경에 입성이라고 할 때 우리가 얼마나 이가 갈렸는 줄 아오?","note":"p.71"},{"book":"그 산이 정말 거기에 있었을까","word":"궐리다","meaning":"불기운이 세다","note":"","example":"그가 궐리 타는 불길 위에 장작개비를 몇 개 더 보탰다."},{"book":"그 산이 정말 거기에 있었을까","word":"도통하다","meaning":"사물의 이치를 깨달아 통하다","example":"웃음 끝에 그가 도통한 표정으로 한 마디 더했다.","note":"p.81"},{"book":"그 산이 정말 거기에 있었을까","word":"악바리","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"아이들이 악바리 끈둥이 울어 제쳤다."},{"book":"그 산이 정말 거기에 있었을까","word":"일도양단","meaning":"머뭇거리지 않고 선뜻 결단함","example":"실로 피 한 방울 안 흘리는 절묘한 일도양단이었다.","note":"p.85"},{"book":"그 산이 정말 거기에 있었을까","word":"군일","meaning":"하지 아니하여도 좋을 쓸데없는 일","example":"이제 그들에게는 신임장과 식권이 나오는 일만 남았는데 우리 집에서 세 식구가 추가됐으니 군일이었다.","note":"p.86"},{"book":"그 산이 정말 거기에 있었을까","word":"흠퍼리","meaning":"터무니없이 거들먹거리거나 허풍을 침","note":"판독 확인 필요","example":"그들이 입성한 지 두 달여 만에 처음으로 접해 본 숙성광복은 이렇듯 쌀 한 톨 구경 안 시키고 흠퍼리칠 수 있는 환경적인 것이었다."},{"book":"그 산이 정말 거기에 있었을까","word":"처네","meaning":"이불 밑에 덧덮는 얇고 작은 이불","example":"토한 걸 닦아 주려고 처네 위에 덧씌운 솜 포대기를 들춰 보면 불화로 같은 고열이 느껴져 가슴이 내려 앉곤 했다.","note":"p.98"},{"book":"그 산이 정말 거기에 있었을까","word":"취비하다","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"마냥 서울을 떠는 황망한 몸이 활발 더 취비하게 늘어지고 기억 저조 굶은 허리로 기다리다시피 하는 게 명색이 인공 치하인데 어찌 저런 주종 관계가 가능한지 신기했다."},{"book":"그 산이 정말 거기에 있었을까","word":"곤죽","meaning":"몹시 질어서 질척질척한 밥","example":"올케하고 잠결에 이런 소리를 주고 받은 것 같지만 나는 곤죽 같은 잠에서 헤어나지 못했다.","note":"p.101"},{"book":"그 산이 정말 거기에 있었을까","word":"찰상","meaning":"찬 기운이 몸에 닿아서 병이 일어남","note":"","example":"할머니는 마지 못해 아이 머리를 잡아 보더니, 감기 찰상 아니면 하고 진단을 내렸다."},{"book":"그 산이 정말 거기에 있었을까","word":"노래하다","meaning":"경험이 많고 교활하다","note":"판독 확인 필요","example":"노래란 의복박사보다 더 무뚝뚝하고 단정하였다."},{"book":"그 산이 정말 거기에 있었을까","word":"공구하다","meaning":"몹시 두렵다","note":"","example":"우리는 그리 피하려는 마음은 갖았지 더 나쁜 것인지 알 길이 없는 채로 마님의 무릎을 공구하며 우러렀다."},{"book":"그 산이 정말 거기에 있었을까","word":"오용지종이","meaning":"생김새나 크기가 제각기 다른 여럿을 이르는 말","note":"판독 확인 필요","example":"영감님은 소릿속에 무슨 일을 하나 그랬나 모처럼 일본 순사한테 잡혀가 혼쭐 두들겨 맞고 나온 적도 있다는데, 자식 중에서도 왜 앞장이고 나오는, 면피도 나오대면 해방되고도 또 빨빨히도 나오고, 의욕중도 나오고, 빨갱사도 나오고, 국군 정도도 나오고, 공무원도 나오고, 빨갱이 잡는 형사도 나오고 오용지종이래."},{"book":"그 산이 정말 거기에 있었을까","word":"근질리다","meaning":"벌레가 살갗 위로 기어가는 것처럼 가려운 느낌이 거듭 나다","note":"","example":"할머니는 계속해서 근질리듯 신발 현관으로 들어갔는데, 이 동네로 시골모이는 했어도 기피 유지 가뭄 아니었고 팔자 기박하여 일찍이 고학가 된 후 떠났기 때문에 외지인과 다름없다고 했다."},{"book":"그 산이 정말 거기에 있었을까","word":"기박하다","meaning":"팔자, 운수 따위가 사납고 복이 없다","example":"할멈은 계속해 군실거리듯 신세 한탄으로 들어갔는데, 이 동네로 시집오기는 했어도 기계 유씨 가문도 아니었고 팔자 기박하여 일찍이 과부가 된 후 떠났기 때문에 외지인과 다름없다고 했다.","note":"p.107"},{"book":"그 산이 정말 거기에 있었을까","word":"은성하다","meaning":"번화하고 풍성하다","example":"오랜만에 접하는 은성하기조차한 분위기도 부러웠지만 무엇보다도 이곳엔 약간 철을 앞지른 것 같은 자유가 은밀히 웅성거리고 있었다.","note":"p.112"},{"book":"그 산이 정말 거기에 있었을까","word":"곤궁하다","meaning":"형편이나 처지가 딱하고 어렵다","note":"","example":"피난민인으로도 곤궁한 신세에 북으로 가는 피난민과 남으로 가는 피난민은 원래적으로 정반대의 사상을 가진 것도 차이의 운명마다."},{"book":"그 산이 정말 거기에 있었을까","word":"거들다","meaning":"잡아 쥐고 당겨서 추켜들다","note":"","example":"장꾼이 고목 버리 금 거들고도 곤란하다."},{"book":"그 산이 정말 거기에 있었을까","word":"대님","meaning":"남자들이 한복을 입을 때, 바지의 발목 부분을 매는 좁은 끈","example":"오빠가 대님을 끌렀다.","note":"p.131"},{"book":"그 산이 정말 거기에 있었을까","word":"허룩하다","meaning":"줄거나 없어져 적다","example":"내 생전에 이렇게 한 귀퉁이가 허룩해질 줄 누가 알았겠냐.","note":"p.135"},{"book":"그 산이 정말 거기에 있었을까","word":"전정문불거지다","meaning":"많이 지쳤고 견딜 힘이 없다","note":"판독 확인 필요","example":"늙은 얼굴을 걷어넘기며 깨끗지 못한 할머니의 낙가가 더욱 전정문불거졌다."},{"book":"그 산이 정말 거기에 있었을까","word":"거간","meaning":"사고파는 사람 사이에 들어 흥정을 붙임","example":"나도 잘은 몰라도 물건 거간 같은 건가 보더라.","note":"p.138"},{"book":"그 산이 정말 거기에 있었을까","word":"재깡","meaning":"술을 거르고 남은 찌꺼기","note":"","example":"재깡을 빚다가 병든 딸내미 먹일 것만큼 홍씨 빠진 빈집 담 하나 낳은 명물을 못 낸 숙박가."},{"book":"그 산이 정말 거기에 있었을까","word":"굿전","meaning":"흥정을 붙여 주고 그 보수로 받는 돈","note":"","example":"흥정을 붙여 주고 그 보수로 받은 돈을 굿전이라 했다."},{"book":"그 산이 정말 거기에 있었을까","word":"속","meaning":"노름할 때, 손대는 대로 잘 맞아 나오는 운","note":"","example":"속이 안 풀 때는 며칠 푹 쉬는 게 수예요."},{"book":"그 산이 정말 거기에 있었을까","word":"쥐뿔이","meaning":"판독 확인 필요","note":"판독 확인 필요","example":"그러나 수속은 걸고 거기 뿔을 내세우지 않고 '여자 뿔나는 자리고 쥐뿔이'라는 격문을 붙였다."},{"book":"두 사람의 인터내셔널","word":"위악적","meaning":"짐짓 악한 체하는 것","example":"오아시스가 인터뷰에서 “우리는 예전에 끝났어”라며 위악적으로 남긴 말은 재미있었다.","note":"p.149"},{"book":"두 사람의 인터내셔널","word":"치","meaning":"‘사람’을 낮잡아 이르는 말","example":"그런 치들은 조치가 취해지지 않으면 선택할 수 있는 다음 패를 지니고 있으며, 거기에는 법과 제도, 언론의 힘도 포함된다.","note":"p.161"},{"book":"두 사람의 인터내셔널","word":"암약","meaning":"남들 모르게 맹렬히 활동함을 이르는 말","example":"전교조를 한국 교육에 암약하는 간첩 집단 취급하는 세계관은 황당하다못해 순진해 보였다.","note":"p.162"},{"book":"두 사람의 인터내셔널","word":"소구 대상","meaning":"방송, 광고, 예술 따위의 활동에서 그 대상이 되는 수용자","example":"자신이 마르크스를 긍정하려는 것인지 부정하려는 것인지 혼란스럽기도 했지만 소구 대상을 고려할 때 유효한 정보라는 것만큼은 분명했다.","note":"p.168-169"},{"book":"두 사람의 인터내셔널","word":"풍절음","meaning":"자동차가 주행할 때, 공기의 압력 때문에 문틈에서 나는 바람 소리","example":"풍절음이 통감자가 덜덜 떠는 소리처럼 들렸다.","note":"p.211"},{"book":"두 사람의 인터내셔널","word":"포말","meaning":"물 따위에 생기는 거품","example":"잿빛 하늘 아래 검푸른 바다와 부서지는 하얀 포말.","note":"p.214"},{"book":"두 사람의 인터내셔널","word":"변통","meaning":"돈이나 물건 따위를 융통함","example":"굶지만 않는 형편이었지만 몇백만 원쯤은 변통할 수 있었을 것이다.","note":"p.215"},{"book":"두 사람의 인터내셔널","word":"혼몽","meaning":"정신이 흐릿하고 가물가물함","example":"혼몽한 가운데 계단을 내려오는 발소리가 들렸다.","note":"p.226"},{"book":"떨림과 울림","word":"선문답","meaning":"주어진 문제와는 상관없이 한가로이 주고받는 이야기를 놀림조로 이르는 말","example":"‘당구공’의 대리문은 무엇일까? 물리학자의 답은 ‘소리'다. 선문답으로 들릴 것이다.","note":"p.130"},{"book":"더 좋은 삶을 위한 철학","word":"도매금으로","meaning":"각각의 차이에도 불구하고 여럿이 같은 무리로 취급받음을 비유적으로 이르는 말","example":"바로 이것이 공리주의의 세계관을 무조건 도매금으로 따라가다 보면 그 끝에서 직면하는 ‘행복 펌프’의 위험성이다.","note":"p.155-156"},{"book":"더 좋은 삶을 위한 철학","word":"어물쩍","meaning":"말이나 행동을 일부러 분명하게 하지 아니하고 적당히 살짝 넘기는 모양","example":"맞다, 어물쩍 빠져나가기는 불가능해 보인다.","note":"p.247"},{"book":"더 좋은 삶을 위한 철학","word":"찬동","meaning":"어떤 견해에 대하여 옳거나 좋다고 판단하여 뜻을 같이함","example":"사르트르는 전후 유럽에서 공산주의에 찬동했는데, 사람이 서로 연결되는 방법을 찾으려고 하다 보니 그런 정치적 신념이 살짝 섞여 나온 것일지도 모르겠다.","note":"p.307"},{"book":"가녀장의 시대","word":"요원하다","meaning":"아득히 멀다","example":"온 식구를 죄다 데리고 살고 싶어 하는 시아버지의 특성상 분가는 요원해 보였으나, 복희는 자유를 갈망하여 웅이를 설득하였다.","note":"p.38"},{"book":"가녀장의 시대","word":"천착하다","meaning":"깊이 살펴 연구하다","example":"슬아는 어쩐지 시대를 반 발짝만 앞서가야 하는데 두 발짝 앞서가서 성과를 내지 못했던 이들의 서사에 천착했다.","note":"p.160"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"둥덩산같이","meaning":"물건이 많이 쌓여 수북하게","example":"둥덩산같이 솜을 둔 저고리 하나면 겨울을 났다.","note":"p.14"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"굽잡히다","meaning":"약점이 잡혀 기를 펴지 못하다","example":"엄마를 괴롭히기만 여기던 어른들의 마음도 많이 누그러진 것 같았다. 그건 누그러졌다기보다는 굽잡히고 있는 건지도 몰랐다.","note":"p.42"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"종주먹","meaning":"쥐어지르며 을러댈 때의 주먹을 이르는 말","example":"이렇게 애걸로 바꾸어도 엄마의 마음이 돌아선 것 같지 않자 할머니는 작전을 바꾸어 나한테 종주먹을 댔다.","note":"p.45"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"허위단심","meaning":"허우적거리며 무척 애를 씀","example":"허위단심 꼭대기까지 올라갔는데도 동네는 계속 됐다.","note":"p.54"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"생급스럽다","meaning":"하는 일이나 행동 따위가 뜻밖이고 갑작스럽다","example":"천 년을 내려온 것처럼 안정된 구도에 익숙해진 나의 심미안에 조악한 원색으로 처바른 반닫이는 너무도 생급스러웠다.","note":"p.56"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"일소에 부치다","meaning":"대수롭지 않게 여겨 무시해 버리다","example":"시험 칠 날이 임박해서 엄마는 나를 데리고 그 길을 답사하면서 문둥이에 대해 세상에 떠도는 끔찍한 말을 일소에 부쳤다.","note":"p.60"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"깡똥하다","meaning":"입은 옷이 아랫도리가 드러날 정도로 짧다","example":"예쁘장하고 깡똥한 양복으로 차려 입은 애가 대부분이었다.","note":"p.82"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"중뿔나다","meaning":"어떤 일에 관계없는 사람이 불쑥 참견하며 나서는 것이 주제넘다","example":"산까지 넘어 문안에 있는 학교에 다니는, 중뿔난 시골뜨기를 이단시했다.","note":"p.92"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"소증","meaning":"푸성귀만 너무 먹어서 고기가 먹고 싶은 증세","example":"그렇지만 어떻게 소증 난다고 곰국거리 사게 돈을 꿔 달래누","note":"p.129"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"귀살스럽다","meaning":"마구 뒤얽혀 정신이 어수선하다","example":"과연 몇 날 며칠을 쓸고 닦고 도배하고 나니 한결 집 꼴이 되어 가긴 했지만 어머니가 왜 오직 뼈대 하나만 보고 그 귀살스러운 집을 샀나를 이해한 것은 나중이었다.","note":"p.132"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"용약하다","meaning":"용감하게 뛰어가다","example":"아침에 운동장에서 조회를 할 때 마다 황국신민의 맹세를 하고 나서 군가 행진곡에 밭을 맞춰 교실에 들어갈 때면 괜히 피가 뜨거워지곤 했는데 그건 뭔가를 무찌르고 용약해야 할 것 같은 호전적인 정열이었다.","note":"p.141"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"처녀지","meaning":"사람이 살거나 개간한 적이 없는 자연 그대로의 땅","example":"그 애에 비해 나는 처녀지와 다름이 없었다.","note":"p.153"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"아귀아귀","meaning":"음식을 욕심껏 입 안에 넣고 마구 씹어 먹는 모양","example":"이불 보따리 등 짐이 많았고, 바가지가 울렁울렁 매달린 보따리에 기대어 조는 노인네가 있는가 하면 개떡이나 조밥 따위를 펼쳐 놓고 아귀아귀 먹는 아이들도 있었다.","note":"p.159"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"애면글면","meaning":"몹시 힘이 겨운 일을 이루려고 갖은 애를 쓰는 모양","example":"서울에 애면글면 말뚝을 박은 일이며 외아들에 대한 기대와 자랑이 온통 허망한 눈치였다.","note":"p.186"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"종댕이","meaning":"작은 바구니","example":"낚시질을 하는 게 아니라 그물을 던져서 잡았는데 숙부가 광문을 열고 어깨에 그물을 메면 나는 으레 종댕이를 들고 신이 나서 따라나섰다.","note":"p.191"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"나뭇등걸","meaning":"나무를 베어 내고 남은 밑동","example":"가끔 재수 나쁘게 물속에 잠겨 있던 나뭇등걸 같은 것에 그물이 걸려 숙부가 해엄쳐 들어가 찢긴 그물을 가져오고 빼 올 적도 있었지만, 아주 가끔이긴 하지만 뱀장어가 잡힐 적도 있었다.","note":"p.191"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"우지끈뚝딱","meaning":"크고 단단한 물건이 요란스럽게 부러지거나 부서지며 다른 물체와 부딪치는 소리","example":"그들은 저희들끼리 희희낙락 우쭐대면서 우지끈뚝딱 우리 집 세간이며 문짝을 때려 부수기 시작했다.","note":"p.200"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"구메구메","meaning":"남모르게 틈틈이","example":"그리고 구메구메 나오느니 그저 한약 생약 등 약 보따리였다.","note":"p.204"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"흐늑흐늑","meaning":"'흐느적흐느적'의 준말","example":"그 여자 앞에서 숙녀는 딴사람처럼 흐늑흐늑해 보였고 숙부는 자신이 그 꼴이 된 걸 부끄러워하기보다는 즐거워하는 것 같았다.","note":"p.221"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"곬","meaning":"한쪽으로 트여 나가는 방향이나 길","example":"오빠는 비로소 제 곬을 찾은 거였다.","note":"p.254"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"야비다리","meaning":"보잘것없는 사람이 제 딴에는 가장 만족하여 부리는 교만","example":"겪은 지 얼마 안 되는 이차대전의 경험에 미루어 다분히 이기적인 생각이었지만 전쟁이 날 수록 시골로 가길 참 잘 잘했다고 야비다리를 피우면서 살 수 있을지언정 후회할 까닭이 없었다.","note":"p.265"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"약비나다","meaning":"정도가 너무 지나쳐서 진저리가 날 만큼 싫증이 나다","example":"소를 통째로 잡아다가 각을 떠서 딴 부대하고 나누긴 했지만 한 이틀 약비나게 고기로만 배를 불린 적도 있다고 했다.","note":"p.278"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"츱츱하다","meaning":"너절하고 염치가 없다","example":"먹는 것에 츱츱한걸 가장 좋지 못한 일로 교육받아 온 우리는 남에게 그런 혐의를 받는다고 상상하는 것만으로도 소름이 끼쳤다.","note":"p.279"},{"book":"그 산이 정말 거기에 있었을까","word":"치지도외","meaning":"마음에 들지 아니함","example":"우리는 남쪽에 아무도 아는 사람이 없고 가진 돈도 없다, 오빠의 건강 상태는 겨울보다는 많이 좋아졌다고 해도 먼 길을 걸을 만하지 않다, 또 겪어보니 북쪽 정부도 남쪽 정부도 얼마 남지 않은 쭉정이들을 겁주기보다는 달래거나 치지도외하는 경향이더라, 더군나나 이번엔 식구들도 여럿이 모여 있으니 서로 의지가 돼 아무리 어려운 세상도 견디어 내기가 훨씬 수월할 것이다.","note":"p.159"},{"book":"그 산이 정말 거기에 있었을까","word":"증","meaning":"병을 앓을 때 나타나는 여러 가지 상태나 모양","example":"제 증이 아니야.","note":"p.161"},{"book":"그 산이 정말 거기에 있었을까","word":"요요하다","meaning":"맵시가 있고 날씬하다","example":"그가 여자의 얼굴에 피어난 복사꽃 같은 요요함만 보고 그 안에 번창하는 고약한 병균에는 눈멀어 열병처럼 사랑하고, 그녀의 청대 같고 관옥 같은 새신랑이 되어 '거기'로 신행을 갔을 때, '거기'서 대대로 행세깨나 하고 살던 처가 친족들과 늙은 장인 장모가 그를 얼마나 환대하고 예뻐했을까는 보지 않아도 본 듯 했다.","note":"p.163"},{"book":"그 산이 정말 거기에 있었을까","word":"오열","meaning":"내부에 있으면서도 외부의 반대 세력에 호응하여 활동하고 있는 집단","example":"헌병이나 검찰의 검문이 잦은 것은 행여 피난민을 가장한 적의 오열이 섞여 있을까봐 그런다는 거였다.","note":"p.165"},{"book":"그 산이 정말 거기에 있었을까","word":"드새다","meaning":"길을 가다가 집이나 쉴 만한 곳에 들어가 밤을 지새다","example":"그런 상황산골에도 집집마다 피난민들로 방이 차 있어서 가까스로 거적을 깔고 드샐 수 있는 헛간밖에 못 얻었다.","note":"p.167"},{"book":"그 산이 정말 거기에 있었을까","word":"범강장달이","meaning":"키가 크고 우락부락하게 생긴 사람","example":"만약 그들이 그런 목적으로 들이닥치면 어쩔 셈으로 보초를 섰느냐고 했더니, 깔든지 베고 눕는 한이 있더라도 이 범강장달이 같은 남자 스무 명이서 여자 둘을 감추지 못하겠냐고 했다.","note":"p.167"},{"book":"그 산이 정말 거기에 있었을까","word":"국으로","meaning":"자기 주제에 맞게","example":"나도 따라 나서고 싶었지만 달갑게 여기는 것 같지 않아 국으로 가만히 있기로 했다.","note":"p.179"},{"book":"그 산이 정말 거기에 있었을까","word":"끌탕","meaning":"속을 태우는 걱정","example":"속으로 끌탕을 하던 게 하도 쉽게 해결이 되자 꼭 뒤에서 다시 불러 세울 것만 같아 나는 자꾸 앞으로 고꾸라지고 언니는 능청을 있는 대로 다 떨면서 과시하고 있었다.","note":"p.179"},{"book":"그 산이 정말 거기에 있었을까","word":"사복개천","meaning":"거리낌 없이 욕설이나 상말을 마구 하는 입이 더러운 사람을 이르는 말","example":"보나마나 입이 사복개천 같은 것들일 텐데, 입이 천 근 같은 느이 작은애비가 오죽해야 그 짓을 했겠냐.","note":"p.181"},{"book":"그 산이 정말 거기에 있었을까","word":"휘하다","meaning":"무서운 느낌이 들 정도로 쓸쓸하고 고요하다","example":"전에 세 살던 사람 중엔 피난 갔다 돌아온 집도 있어서 그 큰 집에 근숙이 언니 혼자 있어도 별로 휘해 보이지 않았다.","note":"p.186"},{"book":"그 산이 정말 거기에 있었을까","word":"질정하다","meaning":"갈피를 잡아서 분명하게 정하다","example":"돈암시장의 순대 냄새와 꿀꿀이죽 냄새가 뒤섞인 냄새, 그 냄새에 오장이 뒤틀리는 듯한 식욕을 이기지 못해 지친 짐승처럼 정기 없이 번들대는 눈과 어두컴컴한 얼굴로 두 가지 음식의 영양가와 부피와 주머니 사정을 암산으로 신출해 내느라 발걸음을 질정 못 하는 막벌이꾼.","note":"p.216"},{"book":"그 산이 정말 거기에 있었을까","word":"뉴똥","meaning":"빛깔이 곱고 보드라우며 잘 구겨지지 아니하는 명주실로 짠 옷감","example":"허 사장인 듯 싶은 사십도 채 안 돼 보이는 신수 좋은 남자가 명주 바지저고리 차림으로, 내 나이 또래밖에 안 돼 보이는 피부가 고운 여자와 함께 아랫목에 깔아 놓은 뉴똥 포대기 밑에 발을 넣고 앉은 채 우리를 맞았다.","note":"p.219"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"공구","meaning":"몹시 두려움","example":"엄마는 화를 낼 줄 알았는데 즉각 생생하게 떠오른 표정은 부정을 탄 것처럼 공구하고 꺼리는 기색이었다.","note":"p.287"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"내남없이","meaning":"나와 다른 사람이나 모두 마찬가지로","example":"내남없이 애국심이 가슴에서 목구멍까지 벅차올랐다.","note":"p.289"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"질급","meaning":"몹시 놀라거나 겁이 나서 갑자기 숨이 막힘","example":"수복이 되고 나서 밖에 나간 엄마를 보고 어쩔 사람이 질급을 하더라는 것이었다.","note":"p.291"},{"book":"그 많던 싱아는 누가 다 먹었을까","word":"서리서리","meaning":"감정 따위가 매우 복잡하게 얽혀 있는 모양","example":"의사가 시범으로 관통한 총구멍에서 피 묻은 심을 뱉고, 소독힌 심을 서리서리 한없이 집어넣는 것을 옆에서 지켜보면서 나는 그 구멍이 지옥으로 통하는 나락만큼이나 어둡고 깊게 느껴졌고, 그 안으로 하염없이 빨려 들어가는 듯한 공포감을 맛보았다.","note":"p.305"},{"book":"그 산이 정말 거기에 있었을까","word":"겨끔내기","meaning":"서로 번갈아 하기","example":"우리가 지금 이고 있는 하늘이 대한민국의 하늘인지 인민공화국의 하늘인지 알아보기 위해 우리는 다시 겨끔내기로 내쫓겼다.","note":"p.12"},{"book":"그 산이 정말 거기에 있었을까","word":"불구대천","meaning":"하늘을 함께 이지 못한다는 뜻으로, 이 세상에서 같이 살 수 없을 만큼 큰 원한을 가짐을 비유적으로 이르는 말","example":"불구대천의 원수끼리 서로 필살의 총구를 겨누고 마주 대치한 한가운데 있는 보이지 않는 선을 돌파하기란 온 몸이 총구멍이 되지 않고는 불가능한 일이다.","note":"p.15"},{"book":"그 산이 정말 거기에 있었을까","word":"까부라지다","meaning":"기운이 빠져 몸이 고부라지거나 생기가 없이 나른해지다","example":"핏기라고는 없는 오빠의 까부라지고 창백한 모습은 가슴에 귀를 대 보고 싶은 충동을 일으킬 정도로 산 사람 같지가 않았다.","note":"p.41"},{"book":"그 산이 정말 거기에 있었을까","word":"여투다","meaning":"돈이나 물건을 아껴 쓰고 나머지를 모아 두다","example":"그래도 우리는 그동안 열심히 여퉈 놓은 게 있어서 그나마 다행이었다.","note":"p.45"},{"book":"그 산이 정말 거기에 있었을까","word":"조하다","meaning":"성질이 거칠고 딱딱하다","example":"그게 되레 우리처럼 식구끼리는 끈끈하게, 남한테는 조한 족속에게는 편했다.","note":"p.69"},{"book":"그 산이 정말 거기에 있었을까","word":"괄다","meaning":"불기운이 세다","example":"그가 괄게 타는 불길 위에다 장작개비를 몇 개 더 보탰다.","note":"p.71"},{"book":"그 산이 정말 거기에 있었을까","word":"악머구리","meaning":"잘 우는 개구리라는 뜻으로, '청개구리'를 이르는 말","example":"아이들이 악머구리 끓듯이 울어 제쳤다.","note":"p.83"},{"book":"그 산이 정말 거기에 있었을까","word":"흰소리","meaning":"터무니없이 거들먹거리거나 허풍을 침","example":"그들이 입성한 지 두 달여 만에 처음으로 접해 본 식량정책은 이렇듯 쌀 한 톨 구경 안 시키고도 흰소리 칠 수 있는 환상적인 것이었다.","note":"p.86"},{"book":"그 산이 정말 거기에 있었을까","word":"추비하다","meaning":"거칠고 더럽고 낮다","example":"마님 시중을 드는 행랑할멈이 훨씬 더 추비하게 늙어가지고 기역 자로 굽은 허리로 기어다니다시피 하는 게 명색이 인공 치하인데 어떻게 저런 주종 관계가 가능한지 신기했다.","note":"p.99"},{"book":"그 산이 정말 거기에 있었을까","word":"촉상","meaning":"찬 기운이 몸에 닿아서 병이 일어남","example":"할머니는 마지 못해 아이 머리를 짚어 보더니, 감기 촉상이구먼, 하고 진단을 내렸다.","note":"p.101"},{"book":"그 산이 정말 거기에 있었을까","word":"노회하다","meaning":"경험이 많고 교활하다","example":"노회한 의학박사보다 더 무표정하고 단정적이었다.","note":"p.101"},{"book":"그 산이 정말 거기에 있었을까","word":"오롱이조롱이","meaning":"생김새나 크기가 제각기 다른 여럿을 이르는 말","example":"영감님은 소싯적에 무슨 일을 하다 그랬나 모처럼 일본 순사한테 잡혀가 흠씬 두들겨 맞고 나온 적도 있다는데, 자식 중에선 왜놈 앞잡이도 나오고, 면서기도 나오더니만, 해방되고는 또 빨갱이도 나오고, 의용군도 나오고, 빨치산도 나오고, 국군 장교도 나오고, 공무원도 나오고, 빨갱이 잡는 형사도 나오고 오롱이조롱이라예.","note":"p.106"},{"book":"그 산이 정말 거기에 있었을까","word":"군실거리다","meaning":"벌레가 살갗 위로 기어가는 것처럼 가려운 느낌이 자꾸 나다","example":"할멈은 계속해 군실거리듯 신세 한탄으로 들어갔는데, 이 동네로 시집오기는 했어도 기계 유씨 가문도 아니었고 팔자 기박하여 일찍이 과부가 된 후 떠났기 때문에 외지인과 다름없다고 했다.","note":"p.107"},{"book":"그 산이 정말 거기에 있었을까","word":"곤고하다","meaning":"형편이나 처지가 딱하고 어렵다","example":"피난민인으로도 곤고한 신센데 북으로 가는 피난민과 남으로 가는 피난민은 원칙적으로 정반대의 사상을 가진 걸로 돼있으니 문제였다.","note":"p.114"},{"book":"그 산이 정말 거기에 있었을까","word":"꺼들다","meaning":"잡아 쥐고 당겨서 추켜들다","example":"잠꾸러기 고모 머리 좀 꺼들어도 괜찮다.","note":"p.127"},{"book":"그 산이 정말 거기에 있었을까","word":"진물진물하다","meaning":"많이 짓무르고 진물이 괴어있다","example":"늘 짓무른 것처럼 깨끗하지 못한 할머니의 눈가가 더욱 진물진물해졌다.","note":"p.135"},{"book":"그 산이 정말 거기에 있었을까","word":"재강","meaning":"술을 거르고 남은 찌꺼기","example":"재강을 빌어다 병든 딸에게 먹일지언정 흔해 빠진 빈집 담 하나 넘을 엄두를 못 낸 숙부가, 노린내 나는 구제품 아니면 장물이 분명한 물건들의 거간 노릇이나 해서 구전을 얻어먹는 짓은 부끄러운 줄 모른다는 것은 슬픈 코미디였다.","note":"p.140"},{"book":"그 산이 정말 거기에 있었을까","word":"구전","meaning":"흥정을 붙여 주고 그 보수로 받는 돈","example":"재강을 빌어다 병든 딸에게 먹일지언정 흔해 빠진 빈집 담 하나 넘을 엄두를 못 낸 숙부가, 노린내 나는 구제품 아니면 장물이 분명한 물건들의 거간 노릇이나 해서 구전을 얻어먹는 짓은 부끄러운 줄 모른다는 것은 슬픈 코미디였다.","note":"p.140"},{"book":"그 산이 정말 거기에 있었을까","word":"손속","meaning":"노름할 때에, 힘들이지 아니하여도 손대는 대로 잘 맞아 나오는 운수","example":"손속이 안 날 때는 며칠 푹 쉬는 게 수예요.","note":"p.141"},{"book":"그 산이 정말 거기에 있었을까","word":"쥐벌이","meaning":"잘금잘금 벌어들이는 벌이","example":"그러나 숙모는 결코 자기 벌이를 내세우지 않았고 '여자 벌이는 자고로 쥐벌이'라는 겸손으로 일관했다.","note":"p.142"},{"book":"그 산이 정말 거기에 있었을까","word":"하바리","meaning":"품위나 지위가 낮은 사람을 낮잡아 이르는 말","example":"영어를 못해도 내쫓길 것 같지는 않았지만, 결국은 하바리 점원으로 써먹겠단 소리로도 들려서 약간은 자존심이 상했다.","note":"p.222"},{"book":"그 산이 정말 거기에 있었을까","word":"앙괭이","meaning":"음력 섣달그믐날 밤에, 잠자는 사람의 얼굴에 먹이나 검정 따위를 함부로 그려 놓는 일","example":"그들은 얼굴에다 일부러 앙괭이를 그리고 패거리를 지어 다녔기 때문에, 재수 나쁘게 걸렸다 하면 얼른 한 푼 집어주는 게 수였다.","note":"p.226"},{"book":"그 산이 정말 거기에 있었을까","word":"양공주","meaning":"서양 사람을 상대로 몸을 파는 여자","example":"거지 애들의 밥은 양공주와 '피엑스걸'이었다.","note":"p.226"},{"book":"그 산이 정말 거기에 있었을까","word":"신산하다","meaning":"힘들고 고생스럽다","example":"우리들한테는 갓난아기만 면하면 벌써 생기는 신산하고 고달픈 생활의 그늘이 그들에게는 늙도록 나타나지 않았다.","note":"p.237"},{"book":"그 산이 정말 거기에 있었을까","word":"알락달락하다","meaning":"여러 가지 밝은 빛깔의 점이나 줄 따위 무늬가 고르지 아니하게 촘촘하다","example":"알락달락하고 빤짝빤짝하고 향기로운 미제 물건들이 산더미처럼 쌓인 진짜 피엑스 매장에서는 유들유들한 허사장도 좀 주눅이 드는 것 같았다.","note":"p.239"},{"book":"그 산이 정말 거기에 있었을까","word":"퍼더버리다","meaning":"팔다리를 아무렇게나 편하게 뻗다","example":"거의 다 양단저고리에 비로드 치마를 입은 그들은 비로드가 눌릴까 봐 엉덩이를 훌러덩 까고 인소 속치마를 드러낸 채 퍼더버리고 앉아서, 걷어 올린 치마 앞에다는 팝콘을 잔뜩 받아놓고 어석어석 씹고 있었다.","note":""},{"book":"그 산이 정말 거기에 있었을까","word":"그러안다","meaning":"두 팔로 싸잡아 껴안다","example":"월급 소리에 정신이 번쩍 나서 가죽 책가방을 그러안았다.","note":"p.256"},{"book":"그 산이 정말 거기에 있었을까","word":"구순하다","meaning":"서로 사귀거나 지내는 데 사이가 좋아 화목하다","example":"한집에서 다들 구순하게 사는 것 보면 이상해.","note":"p.258"},{"book":"그 산이 정말 거기에 있었을까","word":"뒤룩거리다","meaning":"화가 난 기색이 행동으로 크게 나타나다","example":"걸음걸이가 뒤룩거리고 티나 김에 대해서도 이랬다저랬다 했다.","note":"p.258"},{"book":"그 산이 정말 거기에 있었을까","word":"임","meaning":"머리 위에 인 물건","example":"그러나 올케는 이불 보따리만한 임을 이고 떠나면서, 재수 좋으면 해 안에, 늦어도 내일까지는 돌아올 수 있을 거라는 속 들여다뵈는 약속을 잊지 않았다.","note":"p.270"},{"book":"그 산이 정말 거기에 있었을까","word":"꿩 구워 먹은 자리","meaning":"어떠한 일의 흔적이 전혀 없음","example":"허 사장이 내 탓을 한 건 아니었지만, 열심히 만든 서류가 제출하는 족족 꿩 구워 먹은 자리가 되자 은근히 위축될 수 밖에 없었다.","note":"p.279"},{"book":"그 산이 정말 거기에 있었을까","word":"별유천지","meaning":"특별히 경치가 좋거나 분위기가 좋은 곳","example":"집엔 버는 사람은 없이 먹는 입만 우글거리지, 직장은 삐까뻔쩍 별유천지인데다 돈다발이 날아다니는 켯속은 훤히 보이지, 웬만큼 심지가 굳지 않고서는 월급날만 기다리기가 쉬운 노릇이 아니죠.","note":"p.281"},{"book":"그 산이 정말 거기에 있었을까","word":"켯속","meaning":"일이 되어가는 속사정","example":"집엔 버는 사람은 없이 먹는 입만 우글거리지, 직장은 삐까뻔쩍 별유천지인데다 돈다발이 날아다니는 켯속은 훤히 보이지, 웬만큼 심지가 굳지 않고서는 월급날만 기다리기가 쉬운 노릇이 아니죠.","note":"p.281"},{"book":"그 산이 정말 거기에 있었을까","word":"너부죽하다","meaning":"넓고 평평한 듯 하다","example":"나는 허 사장이 서울대학을 그의 너부죽한 입에 물고 씹고 있는 것처럼 느껴져, 사납게 달려들어 손가락으로 우벼 파내고 싶은 충동을 억제하느라 다시 종이 한 장을 끌어당겼다.","note":"p.283"},{"book":"그 산이 정말 거기에 있었을까","word":"턱찌끼","meaning":"먹고 남은 음식","example":"마지막 이조의 여인, 정경부인 노릇을 해도 손색이 없을 정도로 도도하고 칼칼한 성품과 서릿발 같은 자존심을 지닌 우리 엄마를 겨우 양키 턱찌끼로 부양한다는 것은 우리 집안의 구제할 길 없는 타락이요, 엄마에 대한 저질의 모독, 천박한 음해였다.","note":"p.287"},{"book":"그 산이 정말 거기에 있었을까","word":"야죽야죽","meaning":"얄미울 정도로 짖궂게 자꾸 비웃으며 이야기하는 모양","example":"야죽야죽 잔소리를 해 쌓으면 사십줄 오십줄의 화가들은 고개를 길게 늘어트리고 벌 받듯이 경청을 했다.","note":"p.293"},{"book":"그 산이 정말 거기에 있었을까","word":"숫보기","meaning":"순진하고 어수룩한 사람","example":"나를 숫보기고 보고, 멋 내기가 그럼 쉬운 줄 아느냐고 놀리는 양색시도 있었다.","note":"p.296"},{"book":"그 산이 정말 거기에 있었을까","word":"소치","meaning":"어떤 까닭으로 생긴 일","example":"월급도 받을 만큼 받고 밖에서도 부러워하는 피엑스 월급 자리를 기회만 있으면 밑바닥까지 전락한 것처럼 느끼는 것도 우월함의 소치였다.","note":"p.302"},{"book":"그 산이 정말 거기에 있었을까","word":"몸이 나다","meaning":"몸에 살이 올라 뚱뚱해지다","example":"그녀의 남편은 몸이 나기 시작하는 중년이었고, 그녀가 주선해서 얻어 줬다는 작은 댁은 그녀에게 충실한 하녀처럼 굴었다.","note":"p.309"},{"book":"그 산이 정말 거기에 있었을까","word":"화락하다","meaning":"화평하게 즐기다","example":"바깥채의 화락한 웃음소리에 귀를 기울이다 말고 티나 김이 나를 똑바로 보며 말했다.","note":"p.309"},{"book":"그 산이 정말 거기에 있었을까","word":"늘쩍지근하다","meaning":"몹시 느른하다","example":"서로 주고받을 게 고작 하품밖에 없는 늘쩍지근한 오후였다.","note":"p.312"},{"book":"그 산이 정말 거기에 있었을까","word":"요기롭다","meaning":"요사스럽고 기이하다","example":"밤도 아닌, 낮도 아닌 시간의 벚꽃이 풍기는 밝음은 화사하다기보다는 숨을 틀어 막을 듯이 요기로워서 그런지도 몰랐다.","note":"p.314"},{"book":"그 산이 정말 거기에 있었을까","word":"신록","meaning":"늦봄이나 초여름에 새로 나온 잎의 푸른 빛","example":"안마당에도 나무가 많았는데 신록이 한창 예쁜 철이건만 울울해 보였다.","note":""},{"book":"그 산이 정말 거기에 있었을까","word":"울울하다","meaning":"상쾌하지 않고 갑갑하다","example":"안마당에도 나무가 많았는데 신록이 한창 예쁜 철이건만 울울해 보였다.","note":""},{"book":"그 산이 정말 거기에 있었을까","word":"구존","meaning":"부모가 모두 살아 계심","example":"부모가 구존해 계셨고 큰 형한테서 난 조카가 사 남매가 될 정도로 번족한 집안이었다.","note":"p.316"},{"book":"그 산이 정말 거기에 있었을까","word":"우세스럽다","meaning":"놀림이나 비웃음을 받을 만하다","example":"아이고 우세스러워.","note":"p.326"},{"book":"그 산이 정말 거기에 있었을까","word":"불하","meaning":"국가 또는 공공단체의 재산을 개인에게 팔아넘기는 일","example":"직원 출입문인 뒷문 밖은 조용한 얘기를 할 만하지 않은 북적거리는 뒷골복인데다가, 그 날은 하필 업자가 불하 맡은 쓰레기를 실어 나르는 일이었다.","note":"p.328"},{"book":"그 산이 정말 거기에 있었을까","word":"스스럽다","meaning":"친분이 그리 두텁지 못하여 조심스럽다","example":"그이는 사교술 같은 것하고는 상관없이 천성적으로 남을 조금도 스스럽지 않게 하는 형이었다.","note":"p.331"},{"book":"그 산이 정말 거기에 있었을까","word":"기통","meaning":"'기'를 속되게 이르는 말","example":"너무도 완벽한 그들의 휴머니즘에 기통 터진 노무자들이 떼를 지어 항의를 했던 모양이다.","note":"p.332"},{"book":"그 산이 정말 거기에 있었을까","word":"자위 뜨다","meaning":"무거운 물건이 힘을 받아 조금 움직이다","example":"엄마도 입버릇처럼 내가 기가 세니까 이 집에서 살지, 라고 해 오던 집이 드디어 마음에서 자위를 뜨니까 한시가 급했나 보다.","note":"p.339"},{"book":"그 산이 정말 거기에 있었을까","word":"십장","meaning":"일꾼들을 감독하는 우두머리","example":"그 좋은 학교 그만두고 시집가겠다는 데가 겨우 노가다 십장이라구?","note":"p.342"},{"book":"그 산이 정말 거기에 있었을까","word":"일가문중","meaning":"멀고 가까운 모든 일가","example":"친밀해서 작위까지 받은 집안에 못사는 일가문중이 모여들어 굽실대며 아부하는 꼴은 목불인견이었다.","note":"P.344"},{"book":"그 산이 정말 거기에 있었을까","word":"목불인견","meaning":"눈으로 차마 볼 수 없음","example":"친밀해서 작위까지 받은 집안에 못사는 일가문중이 모여들어 굽실대며 아부하는 꼴은 목불인견이었다.","note":"P.344"},{"book":"그 산이 정말 거기에 있었을까","word":"첫밗","meaning":"맨 처음의 국면","example":"첫밗에 그이는 자기 집이 대대로 종로 거리에서 선전을 하던 중인 집안이라는 걸 아무렇지 않게 말했다.","note":"P.345"},{"book":"고독한 용의자","word":"성성하다","meaning":"머리털 따위가 희끗희끗하게 세다","example":"백발이 성성한 노부인이 초점 없는 눈빛으로 소파에 기대어 있고, 점잖은 인상에 건장한 체구의 남자가 수심이 드리운 얼굴로 옆에 앉아 있었다.","note":"p.29"},{"book":"고독한 용의자","word":"괴벽","meaning":"괴이한 버릇","example":"‘작가의 괴벽인가?’ 자치는 생각했다.","note":"p.131"},{"book":"고독한 용의자","word":"새되다","meaning":"목소리가 높고 날카롭다","example":"조금 전까지도 주눅 든 얼굴로 떨고 있던 아이잉이 갑자기 새된 목소리로 외쳤다.","note":"p.182"},{"book":"고독한 용의자","word":"윤문","meaning":"글을 윤색함","example":"조금 수정하고 윤문하는 일만 남았어요.","note":"p.338"},{"book":"고독한 용의자","word":"정탐","meaning":"드러나지 않는 사실을 몰래 살펴서 알아냄","example":"정보를 정탐하는 건 흔한 일이야.","note":"p.349"},{"book":"고독한 용의자","word":"세파","meaning":"모질고 거센 세상의 어려움","example":"속절없는 슬픔과 고통을 표현한 가사는 숱한 세파를 겪은 고독한 여행자가 자신의 불행에 한숨지은 뒤 쓴웃음 한 가닥을 애써 떠올리는 장면을 연상케 했다.","note":"p.371"},{"book":"고독한 용의자","word":"성글다","meaning":"여기저기 떠서 빈 곳이 많다","example":"노선생이 게면쩍은 웃음을 지으며 백발이 성글게 덮인 정수리를 긁적였다.","note":"p.435"},{"book":"아가미","word":"행락객","meaning":"놀러나 즐기러 온 사람","example":"상황 판단이 명료하게 되지는 않았지만, 이 사람은 내가 떨어지는 걸 본 다른 행락객들이 구급차를 부르기 위해 허둥대는 동안 먼저 나를 구해주려고 뛰어든 모양인데, 어째서 사람들이 손짓하는 가까운 쪽을 놔두고 굳이 이렇게 멀리 반대쪽으로 헤엄쳐 가는 걸까.","note":"p.15"},{"book":"아가미","word":"입성","meaning":"‘옷’을 속되게 이르는 말","example":"입성을 조금 수습하고 사장을 찾아가 급한 대로 1개월치 월급만이라도 조달을 요구했을 때, 사장은 난처하다는 얼굴로 우는 소리를 하기도 하고 남자가 단단히 버티고 선 데에 놀랐는지 달래기도 하다가 나중에는 으름장도 놓던 끝에 코웃음 치면서 옆에 끼고 온 그 아이라도 어디 앵벌이단한테 팔아버리면 되지 않느냐고 반문했다.","note":"p.26"},{"book":"아가미","word":"만지작장난하다","meaning":"깊은 밤에 온갖 것이 잠자는 듯 고요하다","example":"더구나 이어서 작은 동물들이 부지런히 움직이느라 나뭇잎이 바스락거리는 소리는 껴지 않은 동안이 증명했는데, 이런 소리를 들으면 만지작장난한 밤의 호수에 곧이 가을을, 이내 초에 가장 오래 살아온 사람으로서 싫어도 알아차릴 수밖에 없었다.","note":"p.29"},{"book":"아가미","word":"천댕거리다","meaning":"길게 처져 내려가며 뚝뚝 떨어지다","example":"재생 불량성 질병에 빠진 세상의 모든 앞니 이리로 모아들이라도 하듯 누군가 초에 물을 던지거나 음주와 피난으로 살던 마귀가 나는 일은 거의 원래행사가 되다시피 했다.","note":"p.31"},{"book":"아가미","word":"도란면","meaning":"사람이 별로 가지 않는 외진 곳","example":"사실 몇몇 사체는 그리 많이 도란면에서 급하게 뉴스를 하던 이들이 발견한 셈이었지만, 특별한 시민 정신을 발휘한 주민들에게는 혹시 국경에 들은 데 대한 벌금이 한 달 뒤에 갈갈이 청구되기 때문에 요즘 주민들은 곳곳에서 뭐가 나올지라도 모른 척하고 임무적인 행위를 한 상태였다.","note":"p.32"},{"book":"아가미","word":"추처","meaning":"싱싱이 썩어서 흐르는 물","example":"굳지 구멍으로 지렁이꿈에도 누군가는 거기에 침을 뱉고 누구는 도약질을 하고 누구는 동장문을 갈기고, 누구는 추처를 흘리며, 누구는 그들을 받아 먹어 먹고 무작정 산으로 물고기들을 낚아 지렁성이 억울한 바람을 올리는, 그런 날들이 지속되어 왔다.","note":"p.32"},{"book":"아가미","word":"도사리","meaning":"못자리에 난 어린 잡풀","example":"호수는 가끔 청설모 같은 작은 동물들이 나뭇잎을 밟거나 도사리를 갉는 듯한 소리 말고는 줄곧 고요를 품고 있었다.","note":"p.33"},{"book":"아가미","word":"승강이","meaning":"서로 자기주장을 고집하며 옥신각신하는 일","example":"승강이를 하면서 노모와 소년이 바람맞이 수준의 양철 지붕 아래로 돌아왔을 때는 이미 도알이 잡히기 직전이었다.","note":"p.37"},{"book":"아가미","word":"등살이 걷히다","meaning":"등이 터져 햇살이 비치기 시작하다","example":"노모와 소년이 돌아왔을 때는 이미 등살이 걷히기 전이었다.","note":"p.37"},{"book":"아가미","word":"만단설화","meaning":"온갖 이야기","example":"아까 컵라면 손님들이 들러서 충분히 데워져 있던 물은 오래지 않아 만단설화를 꽃피우는 듯한 소리를 내며 끓어올랐다.","note":"p.50"},{"book":"아가미","word":"노구","meaning":"늙은 몸","example":"아무리 간신히 쓰러지지 않고 버티어 선 노구를 닮은 수퍼마켓 구석방이더라도.","note":"p.55"},{"book":"아가미","word":"상상하다","meaning":"대수롭지 않고 예사롭다","example":"말투는 상상하지, 표정에는 파괴된 등유와 희망의 흔적이 묻어 있지 않았는지, 곧 가까이에서 모습을 드러낼 것만 같았다.","note":"p.61"},{"book":"아가미","word":"다복하다","meaning":"풀이나 작은 나무 따위가 탐스럽게 무성하다","example":"강 한 가운데 꽃을 피워싼 풀들이 다복하게 자라 있었다.","note":"p.63"},{"book":"아가미","word":"보얗다","meaning":"빛이 조금 보얀 듯하다","example":"강 한 가운데 솟은 비위산 둠마라 겨울철이 걷히고 보얗한 새벽 물결이 너머로 선명히 드러났다.","note":"p.63"},{"book":"아가미","word":"흉발","meaning":"다른 동물이나 물체에 달려들기 위한 기관","example":"어느 하나 위험하지 않은 구석 없이 그 자체로 거대한 흉발과도 같이 악착스러운 동물들을 지닌 강물에 대하여.","note":"p.68"},{"book":"아가미","word":"강상하다","meaning":"물 따위가 썩 맑고 깨끗하다","example":"가슴에 닿아 부서지는 물거품을 받고 깊이 들어갈수록 드러나는 정경과 파도의 사기를.","note":"p.70"},{"book":"아가미","word":"도지개를 들다","meaning":"얌전히 앉아 있지 못하고 몸을 이리저리 꼬며 움직이다","example":"의사가 아이의 목을 누른 두 개의 손가락을 조금 더 벌려 아가미 안을 살펴보려고 시도하자 아이는 아파서인지 기분이 나빠서인지 도지개를 들며 그의 손을 뿌리쳤다.","note":"p.77"},{"book":"아가미","word":"사북재간","meaning":"거리낌 없이 욕설이나 상말을 마구 하는 입이 더러운 사람","example":"강병은 평소 집에서 노인에게 하던 대로 쓰다 앞에서도 입이 거친 사북재간이었다.","note":"p.78"},{"book":"아가미","word":"도스르다","meaning":"무슨 일을 하려고 긴장하여 마음을 다잡아 가지다","example":"언제라도 마음을 도스르면 그만이라며 그대로 두어 달 남짓 흐르자, 노인은 이제 와 아이를 어딘가로 보내기에는 적절한 시기를 놓쳤다는 생각이 들기 시작했다.","note":"p.82"},{"book":"아가미","word":"해토머리","meaning":"얼었던 땅이 녹아서 풀리기 시작할 때","example":"그러면서도 침울하거나 불안한 기색 없이 처음부터 그곳이 자기 집이었던 양 노인에게 천진한 미소를 지어보일 때면, 강하가 처음 이곳에 왔을 때의 불퉁한 눈초리와 크게 대조되었기에, 노인의 마음은 해토머리의 잔설처럼 녹아내렸다.","note":"p.88"},{"book":"아가미","word":"수런거리다","meaning":"여러 사람이 한데 모여 수선스럽게 자꾸 지껄이다","example":"음산하게 수런거리는 가지들을 쳐낸 뒤 생장 후에도 아담한 모습을 유지하는 딸기나무들을 심어 주위를 둘러싼 다음, 발이 미끄러져 호수에 빠지지 않도록 가풀막졌던 둘레 바닥을 산책로로 다지고 돌 장식으로 꾸몄다.","note":"p.92"},{"book":"아가미","word":"가물막지다","meaning":"엉성하게 가지런히 비뚤지 않다","example":"밥이 미끄러져 호수에 빠지지 않도록 가물막지게 둘러 바닥은 색색으로 다지고 돌 장식으로 꾸몄다.","note":"p.92"},{"book":"아가미","word":"첨버오르다","meaning":"아래에서 위로 힘 있게 오르다","example":"수면에 일어난 파문과 함께 어떤 선명이나 걸음처럼 호수 위로 아이들의 머리가 첨버올랐다.","note":"p.98"},{"book":"아가미","word":"드티다","meaning":"비키거나 밀려 약간 틈이 생기다","example":"강하가 손아귀에 힘을 주자 곤은 발뒤꿈치를 조금씩 드티며 물러나다가 두 벽의 모서리가 만나는 곳까지 닿아 더 이상 갈 데가 없어지니 숨이 막혀서 기침하기 시작했다.","note":"p.100"},{"book":"아가미","word":"부레가 굳다","meaning":"몸이 성나다","example":"사람은 자신의 몸에 얽힌 기억이나 행위에 말해져 술이 벗어날 수 없으면, 그는 자신을 구해준 강아가 그렇게 죽었다는 부레가 굳어진 사실을 죽이지는 않으리라는 걸 알아차렸다.","note":"p.102"},{"book":"아가미","word":"분요하다","meaning":"어수선하고 소란스럽다","example":"곤이 본 것은 두툼하고 싱싱하며 탄력 있는 송어 한 마리가 나무 도마 위에서 튀어 오르며 분요한 곡선을 그리는 모습과 곧이어 그 머리를 단숨에 내리치는 주인 남자의 직사각형 식도였다.","note":"p.105"},{"book":"아가미","word":"미몽","meaning":"무엇에 홀린 듯 똑똑하지 못하고 얼떨떨한 정신 상태","example":"그 일을 떠올린 나 자신조차 객관적으로 그 날을 되돌아볼 수 있게 되고 그것이 착각이나 미몽이 아니란 걸 다시 한 번 확인했을 때쯤 엄마는 세상을 떠났고, 나는 그 재를 강에 뿌렸답니다.","note":"p.111"},{"book":"아가미","word":"두려빠지다","meaning":"한 곳을 중심으로 그 부근을 도려낸 것처럼 뭉떵 빠져나가다","example":"엄마의 치료비를 위해 그만둘 수 없었던 일에 인생의 가장 빛났지도 모르는 시간을 집중 투자했는데, 그 몰입의 자리가 최소한의 흔적과 습관만 남긴 채 쏙 두려빠지고 났더니 내 삶은 허허벌판인 거예요.","note":"p.111"},{"book":"아가미","word":"내담","meaning":"물건이 없는 것을 찾고 건짐","example":"할아버지도 그때까지는 그런대로 건강하셨고, 지독한 내담이 갑자기 따른 꿈을 숙면이지만 연금도 내고 해서 주민등록이 안 된 가족을 면으로 데리고 있다는 사실이 거의 설명되지 않게 됐다.","note":"p.118"},{"book":"아가미","word":"계제","meaning":"어떤 일을 할 수 있게 된 형편이나 기회","example":"선뜻 다가가 감동의 눈물과 포옹을 나눌 계제가 아님은 분명했고, 함께한 시간이 턱없이 적다는 데에서 나오는 단세포적인 민망함보다는 더 두꺼운 장벽이 있었다.","note":"p.129"},{"book":"아가미","word":"도령하다","meaning":"많은 사람이 죽 늘어서다","example":"그러면서 이런 거지같아지는 아이는 하루 빨리 놓아버리고, 저 젊고 예쁜 아이들이 도령한 등에 다시 끼고 싶었다.","note":"p.133"},{"book":"아가미","word":"시간관","meaning":"병이 심하지 않으면서 오래 앓는 모양","example":"이동의 남자는 기획사를 무라해서 운명과 전력과 전 빚을 갈아주는 북송 누나와 결혼하고, 빚 정리가 끝나고 오랜 시간 간단히 바라보면서 시간관 끝이 되었다.","note":"p.133"},{"book":"아가미","word":"방기","meaning":"내버리고 아예 돌아보지 아니함","example":"노인도 강한도 이녕을 처음부터 목록에 기되하지 않았던 예정 밖의 수하물처럼 방기하며 딱히 곤더러 돌봐주라거나 어떻게 하라는 말은 하지 않았지만, 곤은 나머지 사람들이 다 나가버리니 언제 그 영혼이 깨어 배회할지 모르는 무덤을 관리하는 묘지기가 된 심정으로 그녀 옆을 지키게 되었다.","note":"p.135"},{"book":"아가미","word":"미망","meaning":"사리에 어두워 실제로는 없는 것을 있는 것처럼 생각하며 헤맴","example":"자꾸만 미망에 사로잡혀 불가능한 삶쪽으로 떠도는 영혼을 관리하고, 그 어떤 돌발 상황이 발생하지 않도록 떼를 입히고 풀을 매는 섬세한 손길이 필요한 일이었다.","note":"p.136"},{"book":"아가미","word":"다치다","meaning":"낫거나 나아가던 병세가 다시 더하여지다","example":"그는 이들의 병이 약으로는 수습되지 않는 때까지 이르렀는지 아니면 그 약이 말고들과 무관한 다른 병을 다스리는 데 쓰여 그런지 자잘한 행동들은 약의 사소한 부작용에 불과한지 알 수 없었으며 어쩌면 그 행동들이 그때까지 이어져서는 병증이 아닌 회복의 과정일 수도 있다는 생각을 품고 살펴보았다.","note":"p.138"},{"book":"아가미","word":"보유스름하다","meaning":"선명하지 않고 약간 보얗다","example":"강하는 자기 상자가 얼마나 무거워졌는지를 모르는 모양이었지만 늦은 밤이나 새벽 집에 돌아올 때마다 집 안 공기를 감싼 보유스름한 습기와 눅눅한 물 냄새는 알아차리는 듯 했다.","note":"p.146"},{"book":"아가미","word":"청연하다","meaning":"티 없이 맑고 아름답다","example":"햇빛을 얻어 반사해야만 하는 구자와 물고려 끝내 돌려든 것과 달리, 아이의 등에 돋아난 것은 그 자체가 빛의 절대량을 보유하고 있어서 그대로 청연하고 눈부신 것만 같았다.","note":"p.151"},{"book":"아가미","word":"곡진히","meaning":"매우 정성스럽게","example":"새벽에 서터를 내릴 때까지 버티며, 손님 정말 죄송합니다만 저희가 마감이거든요, 곡진히 말하는데도 목이 타니 물을 한잔 더 달라는 둥 화장실 타일이 미끄럽다는 둥 시비를 걸면서 끝까지 안 가기로 작정하고 깽판을 놓던 취객이 오물을 바닥에 처갈기고 퍼질러 않은 것까지는 수습할 만했다.","note":"p.152"},{"book":"아가미","word":"시끄러려하다","meaning":"약간 서글하다","example":"이불이 허공에 뜨더라도 두 사람에게서는 시끄러려한 물 냄새가 뒤어 올라지만 문지의 장면은 강하게 상상에 미치지 않았다.","note":"p.159"},{"book":"아가미","word":"사느랗다","meaning":"물체의 온도나 기운이 약간 찬 듯하다","example":"칼끝이 천천히 쇄골에 내려와 닿는 사느란 감각에 곤은 오히려 정신이 맑아진 데다 반감마저 솟아나 이렇게 말하고 싶었다.","note":"p.162"},{"book":"아가미","word":"물그러지다","meaning":"삭거나 물러서 제 모양이 없어지고 허물어지다","example":"당장 순과 과일이 물그러지듯 흘러내린다며 파자 손가락을 타고 흘렀다.","note":"p.175"},{"book":"아가미","word":"드레나다","meaning":"헐거워져서 흔들리다","example":"강하가 공구 상자에서 랜턴을 꺼내 들고 먼저 어머니의 얼굴을 비춰보니 뜬 눈과 벌어진 입이 보이고 다리 곳곳에 베거나 긁힌 핏자국이 있었지만 직접 사인은 수레의 철판 이음매에서 드레나버린 못으로 보였다.","note":"p.178"},{"book":"고통 구경하는 사회","word":"버글대다","meaning":"넓게 퍼지면서 야단스럽게 자꾸 끓어오르다","example":"그 산업의 틈바구니에서 다른 이들과 함께 버글대다 보면 나도 모르게 고통을 착취하거나 구경하고, 모른 척 지나친다.","note":"p.49"},{"book":"고통 구경하는 사회","word":"확증편향","meaning":"자신의 가치관, 신념, 판단 따위와 부합하는 정보만 주목하고 그 외의 정보는 무시하는 사고방식","example":"불행히도 원래 인간에게는 확증편향이 있는데, 알고리즘은 더 극단적이고 단순화한 콘텐츠를 추천하며 이를 부추긴다.","note":"p.50"},{"book":"고통 구경하는 사회","word":"파리하다","meaning":"여위고 핏기가 없이 허약하다","example":"파리한 형광등 불빛 아래로 기자들이 피로와 긴장이 섞인 표정으로 서있었다.","note":"p.55"},{"book":"고통 구경하는 사회","word":"범박하다","meaning":"꼼꼼하지 않아 구체적이지 못하고 두루뭉술하다","example":"이런 비유에서 범박하게 묶이는 나/우리의 범주는, 주로 세계에 이미 존재하는 구분점인 인종, 계급, 국가, 지역, 세대, 성별 등을 모방해 선명성을 확보하는 경우가 잦다.","note":"p.145"},{"book":"고통 구경하는 사회","word":"열없다","meaning":"겸연쩍고 쑥쓰럽다","example":"이 열없는 고백은, 비유의 바깥으로 밀려난 사람들을 불쾌하고 불편하게 만든다.","note":"p.146"},{"book":"고통 구경하는 사회","word":"보퉁이","meaning":"물건을 보에 싸서 꾸려놓은 것","example":"장을 보러 나왔던 아시아계 노인들도 작은 보퉁이가 담긴 수레를 끌며 서둘러 집으로 돌아가고 있었다.","note":"p.156"},{"book":"고통 구경하는 사회","word":"저인망","meaning":"바다 밑바닥으로 끌고 다니면서 깊은 바닷속의 물고기를 잡는 그물","example":"길바닥을 뒤져가며 누군가를 찾는 저인망식 취재가 가장 효율적이거나 가장 현명한 방법은 아니었지만, 때론 어쩔 수 없는 상황도 있다.","note":"p.159"},{"book":"고통 구경하는 사회","word":"너절하다","meaning":"하찮고 시시하다","example":"J에게 이 모든걸 이야기할 순 없었고, 너절한 자기 검열을 털어낸 일부만 이야기할 수 있었다.","note":"p.176"},{"book":"고통 구경하는 사회","word":"벼리다","meaning":"불에 달구고 두드려 날카롭게 만들다","example":"사위대가 원하는 것을 공통의 언어로 벼리어 한국의 독자에게 전달하고, 이들의 현재를 짚고 실현 가능한 미래가 있는지를 헤아려보는 것.","note":"p.181"},{"book":"고통 구경하는 사회","word":"전재","meaning":"어떤 곳에 이미 발표되었던 글을 다른 곳에 그대로 옮겨 실음","example":"“사실성의 '취재 없는 온라인 커뮤니티 전재'라는 문구 행위”가 늘어나고 있다는 분석도 나온다.","note":"p.205"},{"book":"고통 구경하는 사회","word":"미욱하다","meaning":"어리석고 미련하다","example":"‘나는 좋은 사람’이라거나 ‘내가 하는 일은 좋은 일’이라는 헛된 환상 때문인가 싶었지만, 미욱한 환상을 버린 뒤에도 이 말이 주는 기묘한 서먹거림이 남았다.","note":"p.215"},{"book":"고통 구경하는 사회","word":"생래적","meaning":"세상에 태어난 이래 가지고 있는 것","example":"짧은 시간 안에 주의를 끌어야 한다는 매체들의 강박은, 어쩌면 생래적이다.","note":"p.234"},{"book":"고통 구경하는 사회","word":"아연하다","meaning":"너무 놀라서 어안이 벙벙하다","example":"희망에 찬 가능성의 목록을 꼭 나열해 보다가, 얼굴조차 알지 못하는 누군가에게 이런 걸 바란다는 게 얼마나 턱없는 일인가 싶어 아연해지고 만다.","note":"p.237"},{"book":"고통 구경하는 사회","word":"초로","meaning":"노년에 접어드는 나이","example":"수도 없이 이런 질문을 던지는 내게, 한 초로의 백인 기자는 이런 말을 했다.","note":"p.251"},{"book":"고통 구경하는 사회","word":"아슴아슴하다","meaning":"흐릿하고 몽롱하다","example":"새벽의 아슴아슴한 빛깔은 사람과 공간을 거슬러, 새벽 동해 앞바다에 허리춤까지 담근 채 “바다 앞에 오줌을 쌌다”고 상쾌하게 외치며 돌아보던 젊은 아버지의 얼굴을 돌려주었다.","note":"p.256"},{"book":"고통 구경하는 사회","word":"버성기다","meaning":"자연스럽지 못하고 어색하다","example":"그럼에도 고통을 겪고 있는 사람 앞에 떼 지어 몰려가는 일은 늘 버성겼다.","note":"p.11"},{"book":"고통 구경하는 사회","word":"무망하다","meaning":"희망이나 가망이 없다","example":"당장의 고통에 대해 말하고 나면 나아질 거라는 말은 알고 보니 거짓에 가까웠고, 무망한 약속은 너무나 나빠서였다.","note":"p.12"},{"book":"아가미","word":"만귀잠잠하다","meaning":"깊은 밤에 온갖 것이 잠자는 듯 고요하다","example":"더구나 이어서 작은 동물들이 분주히 움직이느라 나뭇잎이 바스락거리는 소리는 작지 않은 동요의 증거였는데, 이런 소리를 들으면 만귀잠잠한 밤의 호수에 금이 갔음을, 이내 촌에 가장 오래 살아온 사람으로서 싫어도 알아차릴 수 밖에 없었다.","note":"p.29"},{"book":"아가미","word":"천덩거리다","meaning":"길게 처져 내리다가 뚝뚝 떨어지다","example":"재생 불량성 질병에 빠진 세상의 모든 인간이 이리로 모여들기라도 하는지 누군가가 호수에 몸을 던지거나 음주와 패싸움으로 살인 미수가 나는 일은 거의 월례 행사가 되다시피 했고, 가끔 호수 깊은 데서부터 무언가 썩는 냄새가 진동할 때면 주민의 신고를 받은 경찰이 와서 조직 다툼의 희생자로 추정되는 시체를 건지기도 했는데, 그렇게 건진 시체는 눈과 입에 청테이프가 붙어 있었고 온몸을 묶은 새끼줄은 천덩거리는 살을 깊숙이 파고들었으며 물고기들이 뜯어 먹다 만 살점들이 끈 여기저기 묻어 나왔다.","note":"p.31"},{"book":"아가미","word":"도린곁","meaning":"사람이 별로 가지 않는 외진 곳","example":"사실 몇몇 시체는 그와 같이 도린곁에서 금지된 낚시를 하던 이들이 발견한 셈이었지만, 투철한 시민 정신을 발휘한 주민들에게는 금지 구역에 들어간 데 대한 벌금이 한 달 뒤에 칼같이 청구되었기 때문에 요즘 주민들은 호수에서 뭐가 나오더라도 모른 척하자가 암묵적인 합의를 한 상태였다.","note":"p.32"},{"book":"아가미","word":"추깃물","meaning":"송장이 썩어서 흐르는 물","example":"금지 구역으로 지정되었음에도 누군가는 거기에 침을 뱉고 누구는 토악질을 하고 누구는 똥오줌을 갈기고 누구는 추깃물을 흘리며, 누구는 그것들을 받아 먹어 무럭무럭 살 오른 물고기들을 낚아서 저녁상에 일용할 반찬으로 올리는, 그런 날들이 지속되어 왔었다.","note":"p.32"},{"book":"아가미","word":"동살이 잡히다","meaning":"등이 터져 햇살이 비치기 시작하다","example":"승강이를 하면서 노모와 소년이 바람맞이 수준의 양철 지붕 아래로 돌아왔을 때는 이미 도알이 잡히기 직전이었다.","note":"p.37"},{"book":"아가미","word":"심상하다","meaning":"대수롭지 않고 예사롭다","example":"말투는 심상했는지, 표정에는 파괴된 몽유와 회한의 흔적이 묻어 있지나 않았는지, 곤은 가게에서의 모습을 되짚어 보았다.","note":"p.61"},{"book":"아가미","word":"다보록하다","meaning":"풀이나 작은 나무 따위가 탐스럽게 소복하다","example":"강 한 가운데 솟은 바위산 틈마다 다보록이 걸린 나무들의 색깔은 보잇한 새벽 물안개 너머로도 선명히 드러났다.","note":"p.63"},{"book":"아가미","word":"보잇하다","meaning":"빛이 조금 보얀 듯하다","example":"강 한 가운데 솟은 바위산 틈마다 다보록이 걸린 나무들의 색깔은 보잇한 새벽 물안개 너머로도 선명히 드러났다.","note":"p.63"},{"book":"아가미","word":"흡반","meaning":"다른 동물이나 물체에 달라붙기 위한 기관","example":"어느 하나 위험하지 않은 구석 없이 그 자체로 거대한 흡반과도 같이 악착스러운 동물성을 지닌 강물에 대하여.","note":"p.68"},{"book":"아가미","word":"징청하다","meaning":"물 따위가 썩 맑고 깨끗하다","example":"기슭에 닿아 부서지는 물거품을 밟고 깊이 들어갈수록 드러나는 징청과 피안의 세계를.","note":"p.70"},{"book":"아가미","word":"가풀막지다","meaning":"땅바닥이 가파르게 비탈져 있다.","example":"음산하게 수런거리는 가지들을 쳐낸 뒤 생장 후에도 아담한 모습을 유지하는 딸기나무들을 심어 주위를 둘러싼 다음, 발이 미끄러져 호수에 빠지지 않도록 가풀막졌던 둘레 바닥을 산책로로 다지고 돌 장식으로 꾸몄다.","note":"p.92"},{"book":"아가미","word":"칩떠오르다","meaning":"아래에서 위로 힘 있게 오르다","example":"수면에 일어난 파열음과 함께, 어떤 선명이나 결의처럼 호수 위로 아이들의 머리가 칩떠올랐다.","note":"p.98"},{"book":"아가미","word":"부레가 끓다","meaning":"몹시 성나다","example":"사람은 자신의 몸에 입힌 기억이나 행위에 밀착되어 쉽게 벗어날 수 없었으며, 곤은 자신을 구해준 강하가 그렇게 즉흥적으로 부레가 끓어서 자신을 죽이지는 않으리라는 걸 알아차렸다.","note":"p.102"},{"book":"아가미","word":"내핍","meaning":"물자가 없는 것을 참고 견딤","example":"할아버지도 그때까지는 그런대로 건강하셨고, 지독한 내핍의 결과에 따른 콧물 수준이지만 연금도 나오고 해서 주민등록이 안 된 가족을 덤으로 데리고 있다는 사실에 거의 신경 쓰시지 않게 됐어요.","note":"p.118"},{"book":"아가미","word":"도열하다","meaning":"많은 사람이 죽 늘어서다","example":"그러면서 이런 거치적거리는 아이는 하루 빨리 낳아버리고, 저 젊고 예쁜 아이들이 도열한 틈에 다시 끼고 싶었다.","note":"p.131"},{"book":"아가미","word":"시난고난","meaning":"병이 심하지 않으면서 오래 앓는 모양","example":"이녕의 남자는 기획사를 무리해서 운영한 결과로 진 빚을 갚아준다는 부동산 부자와 결혼했고, 빚 정리가 끝나자 오랜 시간 간판만 바꿔가면서 시난고난 끌어왔던 기획사 자체를 접었다.","note":"p.133"},{"book":"아가미","word":"더치다","meaning":"낫거나 나아가던 병세가 다시 더하여지다","example":"곤은 이녕의 병이 약으로는 수습되지 않는 데까지 이르렀는지 아니면 그 약이 알코올과 무관한 다른 병을 다스리는 데 쓰여서 그녀의 자잘한 행동들은 약의 사소한 부작용에 불과한지, 그녀 자신이 병이 낫기를 바라고는 있는지 그냥 더쳐서 죽어버릴 셈인지도 알 수 없었으나 어쩌면 그 행위들이 그녀에게 있어서는 병증이 아닌 회복의 과정일 수도 있다는 기대를 품고 살펴보았다.","note":"p.138"},{"book":"아가미","word":"청완하다","meaning":"티 없이 맑고 아름답다","example":"햇빛을 얻어 반사해야만 하는 구차한 물리적 존재들과 달리, 아이의 등에 돋아난 것은 그 자체가 빛의 절대량을 보유하고 있어서 그토록 청완하고 눈부신 것만 같았다.","note":"p.151"},{"book":"아가미","word":"시크무레하다","meaning":"약간 시큼하다","example":"이불이 허공에 펄럭이면서 두 사람에게서는 시크무레한 물 냄새가 튀어 올랐지만 문제의 장면은 강하게 상상에 미치지 않았다.","note":"p.159"},{"book":"아가미","word":"물크러지다","meaning":"썩거나 물러서 제 모양이 없어지고 헤어지다","example":"닿는 순간 과일이 물크러지듯 흘러나온 피가 손가락을 타고 흘렀다.","note":"p.175"},{"book":"인비인","word":"뇌사하다","meaning":"윗사람이 아랫사람에게 물건을 내려주다","example":"종합하자면, 이 검은 고종이 하사한 검이 아니라, 일제가…… 친밀한 관리들에게 뇌사한 검이라는 게 저희의 최종 감정입니다.","note":"p.74"},{"book":"인비인","word":"삿되다","meaning":"보기에 하는 행동이 바르지 못하고 나쁘다","example":"나답지 않게 삿된 말을 중얼대며 맥주를 들이켜도 분이 풀리지 않는다.","note":"p.145"},{"book":"인비인","word":"거웃","meaning":"사람의 생식기 둘레에 난 털","example":"팔다리, 겨드랑이뿐 아니라 거웃까지 전부(머리카락과 눈썹은 도저히 밀 수 없었다).","note":"p.192"},{"book":"인비인","word":"왁작","meaning":"여럿이 매우 어수선하게 떠들거나 웃는 소리","example":"얼떨떨한 얼굴로 이익을 바라보던 동기들이 왁작 웃음을 터뜨렸다.","note":"p.255"},{"book":"인비인","word":"외기","meaning":"두려워하고 꺼림","example":"막창이 익는 족족 집어 먹는 동기들 틈에서 이쪽은 욕지기와 더불어 외기를 느꼈다.","note":"p.255"},{"book":"인비인","word":"욕지기","meaning":"토할 듯 메스꺼운 느낌","example":"막창이 익는 족족 집어 먹는 동기들 틈에서 이쪽은 욕지기와 더불어 외기를 느꼈다.","note":"p.255"},{"book":"인비인","word":"치하","meaning":"남이 한 일에 대하여 고마움이나 칭찬의 뜻을 표시함(주로 윗사람이 아랫사람에게 함)","example":"비아냥과 치하를 섞어 속을 긁긴 했지만, 어찌 되었든 일도 풀리고, 조만간 빚도 청산할 수 있을 테니 더 이상의 속앓이는 없으리라 이익은 확신했다.","note":"p.286"},{"book":"인비인","word":"계교","meaning":"이러저리 생각을 해서 낸 꾀","example":"맥이 뛰고, 땀이 흐르고, 계교도 낼 줄 아는 사람.","note":"p.292"},{"book":"인비인","word":"과단성","meaning":"빠르고 단호하게 결정하는 성질","example":"태양인은 과단성이 있어 어떤 일이든 막힘 없이 처리하지만, 실상 통제광이라 제 뜻대로 풀리지 않으면 불같이 화를 내고, 자존심이 세 과실을 인정하지 않는다고 이익은 살살 흉을 보았다.","note":"p.292"},{"book":"인비인","word":"순치","meaning":"짐승을 길들임","example":"먹이 냄새가 밴 자리를 서성이는 짐승처럼 이익도 그것과의 라포르에 순치되어 지난 사나흘 간 탕전실 걸쇠를 풀지 말지 몇 번이고 고민했었다.","note":"p.301"},{"book":"인비인","word":"눙치다","meaning":"마음 따위를 풀어 누그러지게 하다","example":"웃자고 하는 소리라며 눙치는 노부인을 향해 이익은 억지로 입꼬리를 올렸다.","note":"p.303"},{"book":"인비인","word":"객년","meaning":"이해의 바로 앞의 해","example":"황보는 본래 체육특기자전형으로 대학에 입학하려 했으나, 객년에 낙마 사고로 허리를 크게 다쳐 특기자 선발이 불가능해졌다.","note":"p.15"},{"book":"인비인","word":"하오","meaning":"정오부터 밤 열두 시까지의 시간","example":"홍파동 집 서재는 북향으로 하오에도 해가 거의 들지 않았는데, 황보의 수험 준비로 방을 완전히 개조하여 있던 가구를 전부 빼버리고 간이 침대나 벚나무로 만든 책상만 남겼다.","note":"p.16"},{"book":"인비인","word":"일삭","meaning":"한 달","example":"한 번 가면 열흘이고 일삭이고 꽤 오래 머물다 왔지요.","note":"p.31"},{"book":"인비인","word":"엇돌다","meaning":"서로 반대 방향으로 돌다","example":"그들이 대화로는 늘 엇돌았다.","note":"p.69"},{"book":"프라이드 그린 토마토","word":"침모","meaning":"남의 집에 매어 바느질을 맡아 하고 일정한 품삯을 받는 여자","example":"그러고 나서 2주 뒤 엄마가 결혼식 옷을 만드는 침모인 아이다 심스에게 하시는 얘길 들었어요.","note":"p.23"},{"book":"프라이드 그린 토마토","word":"조차장","meaning":"철도에서, 차량을 서로 연결하거나 떼어내거나 하여 열차를 조절하는 곳","example":"L&N 철도사의 커다란 조차장이 카페에서 겨우 두 블록 떨어진 곳에 있었기 때문에 흑인이고 백인이고 할 것 없이 철도와 관련된 일을 하는 사람들은 모두 그곳에서 식사를 했답니다.","note":"p.73"},{"book":"프라이드 그린 토마토","word":"도락","meaning":"술, 도박 등에 취하여 빠지는 일","example":"이바의 아버지는 부업으로 주류 밀매업을 하는 사람이었는데 체중이 130킬로그램이 넘었고 도락을 즐겼다.","note":"p.130-131"},{"book":"프라이드 그린 토마토","word":"급사","meaning":"관청이나 회사, 가게 따위에서 잔심부름을 시키기 위하여 부리는 사람","example":"당시 빅 조지와 온젤의 아들인 재스퍼는 침대도 있는 기차의 급사였는데, 우리를 마치 루마니아의 왕과 왕비처럼 대우해 주었어요.","note":"p.141"},{"book":"프라이드 그린 토마토","word":"거드럭거리다","meaning":"거만스럽게 잘난 체하며 자꾸 버릇없이 굴다","example":"앞니가 빠지고 사팔뜨기인 그의 친구는 침을 뱉고 나서 바지를 추켜올리더니 거드럭거리며 길을 따라 내려갔다.","note":"p.145"},{"book":"프라이드 그린 토마토","word":"음험하다","meaning":"음산하고 험악하다","example":"머리를 겨누고 내 삶을 지배하는 보이지 않는 총, 그 힘, 그 음험한 위협... 욕 먹는 것에 대한 그 공포는 무엇일까?","note":"p.313-314"},{"book":"우주 대전의 끝","word":"쫀쫀하다","meaning":"소갈머리가 좁고, 인색하며 치사하다","example":"그렇지만 최초로 자기를 놀려준 외계인 학자에게 이름이 마음에 안 든다고 따지는 것도, 우주 전체를 차지하는 덩치에 비해 지나치게 쫀쫀해 보인다고 느꼈다.","note":"p.22"},{"book":"너는 모른다","word":"가붓가붓","meaning":"여럿이 다 조금 가벼운 듯한 느낌","example":"새털구름이 가붓가붓 날아다녔고 잔잔한 북동풍이 불었다.","note":"p.7"},{"book":"너는 모른다","word":"시반","meaning":"사람이 죽은 후에 피부에 생기는 반점","example":"물에서 발견된 사체가 대개 그렇듯 시반은 보이지 않았고 시신의 외피는 한껏 팽대해져 있었다.","note":"p.9"},{"book":"너는 모른다","word":"자분자분","meaning":"성질이나 태도가 부드럽고 조용하며 찬찬한 모양","example":"자분자분 대화를 주고받았지만 어딜 가든지 얼마 동안 집을 비우는지 피차 밝히지도 묻지도 않았다.","note":"p.12"},{"book":"너는 모른다","word":"기름하다","meaning":"조금 긴 듯하다","example":"여인의 기름한 눈매에서 왠지 모를 기시감이 느껴졌던 이유를.","note":"p.35"},{"book":"너는 모른다","word":"옴짝거리다","meaning":"몸의 한 부분이 옴츠러들거나 펴지거나 하며 작게 자꾸 움직이다","example":"외국인 전용 입국심사대에서 차례를 기다리는 동안 어쩔 수 없이 가슴이 옴짝거렸다.","note":"p.45"},{"book":"너는 모른다","word":"찌무룩하다","meaning":"마음이 시무룩하여 유쾌하지 아니하다","example":"그는 실소를 보냈지만 이내 찌무룩해졌다.","note":"p.63"},{"book":"너는 모른다","word":"공연히","meaning":"아무 까닭이나 실속이 없게","example":"엄마는 평소답지 않게 공연히 허둥거렸다.","note":"p.81-82"},{"book":"너는 모른다","word":"허위허위","meaning":"몹시 힘들어하는 모양","example":"혜성은 소파에 거북스럽게 등을 기대고 앉아 허위허위 흐르는 시간을 참고 있었다.","note":"p.89"},{"book":"너는 모른다","word":"계제","meaning":"일이 되어가는 순서나 절차","example":"물론 지금은 한가하게 그런 것을 따지고 있을 계제가 아니었지만 말이다.","note":"p.98"},{"book":"너는 모른다","word":"설레설레","meaning":"큰 동작으로 몸의 한 부분을 가볍게 잇따라 가로흔드는 모양","example":"전화기를 내려놓고서야 은성은 자신이 계속 고개를 설레설레 흔들고 있음을 알았다.","note":"p.99"},{"book":"너는 모른다","word":"적이","meaning":"꽤 어지간한 정도로","example":"적이 당혹스러웠다.","note":"p.115"},{"book":"너는 모른다","word":"가없이","meaning":"끝이 없이","example":"또다시 가없이 기나긴 하루가 시작되는 중이었다.","note":"p.117"},{"book":"너는 모른다","word":"멀거니","meaning":"정신없이 물끄러미 보고 있는 모양","example":"김상호는 도무지 헤아리지 못할 강의 눈동자를 멀거니 바라보고 있었다.","note":"p.126"},{"book":"너는 모른다","word":"는적는적","meaning":"물체가 힘없이 자꾸 축 처지거나 물러지는 모양","example":"그는 는적는적 밤거리를 걸어 커피빈에 도착했다.","note":"p.134"},{"book":"너는 모른다","word":"수인사","meaning":"인사를 차림","example":"그들은 악수 대신 가벼운 목례로 수인사를 나누었다.","note":"p.149"},{"book":"너는 모른다","word":"키들키들","meaning":"웃음을 걷잡지 못하여 입 속으로 잇따라 웃는 소리","example":"같은 반 남자애 하나가 그렇게 부르고 나서 키들키들 웃었다.","note":"p.155"},{"book":"너는 모른다","word":"무람없이","meaning":"예의를 차리지 않으며 삼가고 조심하는 것이 없게","example":"붙임성 좋은 소녀는 같이 길을 걸을 때면 무람없이 쓰윽 팔짱을 껴와서 아이를 당황케 했다.","note":"p.159"},{"book":"너는 모른다","word":"표구하다","meaning":"그림의 뒷면이나 테두리에 종이 또는 천을 발라서 꾸미다","example":"그중 한 부는 표구하여 아이의 방에 걸렸다.","note":"p.163"},{"book":"너는 모른다","word":"실몽당이","meaning":"실을 풀기 좋게 공 모양으로 감은 뭉치","example":"마룻바닥에는 실몽당이처럼 둥그렇게 말린 먼지뭉치가 굴러 다닐 수도 있었다.","note":"p.168"},{"book":"너는 모른다","word":"군색하다","meaning":"보기엔 모자라고 옹색한 데가 있다","example":"돼 군색하게 둘러대고 있는지 스스로도 의아해하면서 상호는 변명을 계속했다.","note":"p.214-215"},{"book":"너는 모른다","word":"둔중하다","meaning":"부피가 크고 무겁다","example":"둔중한 고통이 서서히 심장을 눌러왔다.","note":"p.234"},{"book":"너는 모른다","word":"일별하다","meaning":"한 번 흘낏 보다","example":"아이가 피해자인 사건에서 괴로움을 호소하는 친부모를 동정의 눈으로 일별하고 말아서는 결코 안 되었다.","note":"p.243"},{"book":"너는 모른다","word":"무연하다","meaning":"아무 인연이나 연고가 없다","example":"당당하고 무연하게 어떤 것에도 상처받지 않고서 눈에 보이는 것을 핏속에 기록하고 있었다.","note":"p.299"},{"book":"너는 모른다","word":"수굿하다","meaning":"흥분이 꽤 가라앉은 듯하다","example":"경계의 빛이 완전히 사라진 건 아니었지만 아까보다는 한결 수굿해진 음성이었다.","note":"p.306"},{"book":"너는 모른다","word":"어리어리하다","meaning":"말이나 행동 따위가 다부지지 못하고 어리석은 듯하다","example":"마침내 실물로 눈앞에 나타난 언니의 존재는 아이를 어리어리하게 만들었다.","note":"p.335-336"},{"book":"너는 모른다","word":"휑뎅그렁하다","meaning":"속이 비고 넓기만 하여 매우 허전하다","example":"휑뎅그렁한 공간에 타인의 체온이 아직 남아있었다.","note":"p.359-360"},{"book":"너는 모른다","word":"우두망찰하다","meaning":"정신이 얼떨떨하여 어찌할 바를 모르다","example":"그는 그곳에 우두망찰한 시선을 꽂았다.","note":"p.364"},{"book":"너는 모른다","word":"김치보시기","meaning":"김치를 담아 먹는, 주발보다 작은 모양의 그릇","example":"정통 중국식으로 차린 정찬을 먹을 때에도 라면을 먹을 때에도 언제나 식탁 한쪽에 김치보시기가 놓인 것이 자연스러웠다.","note":"p.377"},{"book":"너는 모른다","word":"황망히","meaning":"갈팡질팡 어쩔 줄 모를 정도로 급하게","example":"황망히 전화를 끊고서 김상호는 방 밖으로 나왔다.","note":"p.387"},{"book":"너는 모른다","word":"먹장구름","meaning":"먹빛같이 시꺼먼 구름","example":"몇 점의 먹장구름이 서쪽 방향으로 소리 없이 떠내려갔다.","note":"p.394"},{"book":"너는 모른다","word":"맵싸하다","meaning":"맵고 싸하다","example":"도시와는 다른 맵싸한 바람이 목덜미를 파고들었다.","note":"p.395"},{"book":"너는 모른다","word":"어룽어룽","meaning":"뚜렷하지 아니하고 흐리게 어른거리는 모양","example":"눈가에 잿빛 그림자가 어룽져 있었다.","note":"p.417"},{"book":"너는 모른다","word":"웅숭그리다","meaning":"춥거나 두려워 몸을 궁상맞게 몹시 웅그리다","example":"이 남자, 좁은 어깨를 잔뜩 웅숭그리고 있는 눈앞의 남자를 믿을 수 있을까.","note":"p.418"},{"book":"너는 모른다","word":"비척비척","meaning":"(비치적비치적의 준말) 몸을 한쪽으로 약간 비틀거리거나 가볍게 절뚝거리며 걷는 모양","example":"비척비척 현관까지 다가가는 짧은 동안, 심장이 빠르게 두근거렸다.","note":"p.421"},{"book":"너는 모른다","word":"허방","meaning":"땅바닥이 움푹 패어 빠지기 쉬운 구덩이","example":"그는 쏜살같이 허방을 갈랐다.","note":"p.468"},{"book":"너는 모른다","word":"언도","meaning":"공판정에서 재판장이 판결을 알리는 일","example":"물론 사형을 언도받지 않는다는 가정하에서의 얘기일 것이다.","note":"p.483"},{"book":"사랑의 기술","word":"공서","meaning":"전혀 다른 것이 함께함","example":"실존의 문제에 대한 신중한 해답으로서 사랑을 말하고 있는가, 또는 ‘공서적 합일’이라고 부를 수 있는 사랑의 미숙한 형태에 대해 말하고 있는가?","note":"p.37"},{"book":"사랑의 기술","word":"인습적","meaning":"예전의 풍습, 습관, 예절 따위를 그대로 따르는 것","example":"인습적 생각에 사로잡힌 사람들 사이에 비판과 적의를 일으킨 요소를 프로이트의 체계로부터 제거하려는 소망은 흔히 이러한 비판을 촉진했다.","note":"p.61"},{"book":"사랑의 기술","word":"자기 본위","meaning":"자기의 감정이나 이해관계를 기준으로 생각하고 행동하는 일","example":"사랑함으로써 그는 자아도취와 자기 본위 상태에 의해 이루어진 고독과 고립이라는 감방에서 벗어난다.","note":"p.66"},{"book":"낭만 사랑니","word":"나한","meaning":"생사를 이미 초월하여 배울 만한 법도가 없게 된 경지의 부처","example":"습윤한 눈망울로 세상을 바라보던 두 나한이 있었다.","note":"p.9"},{"book":"낭만 사랑니","word":"경하","meaning":"경사스러운 일을 치하함","example":"모든 나한이 고개를 숙이고 그의 행차를 경하했다.","note":"p.10"},{"book":"낭만 사랑니","word":"나릿나릿","meaning":"동작이 재지 못하고 좀 느린 모양","example":"잎을 갉는 법을 이제 막 깨우친 애벌레가 시린의 뒷덜미를 나릿나릿 물었다.","note":"p.45"},{"book":"낭만 사랑니","word":"얼개","meaning":"어떤 사물이나 조직의 전체를 이루는 짜임새나 구조","example":"그녀가 별다른 불행이 없어도 살고 싶지 않다 생각하는 데는 이러한 얼개가 있었다.","note":"p.51"},{"book":"낭만 사랑니","word":"기망","meaning":"남을 속여 넘김","example":"이것은 기망이 아니고 무엇인가?","note":"p.71"},{"book":"낭만 사랑니","word":"도야","meaning":"훌륭한 사람이 되도록 몸과 마음을 닦고 기름","example":"이번 과업은 염라님의 건강뿐 아니라 나한들이 도야하기 위해서도 꼭 필요한 과정이옵니다.","note":"p.99"},{"book":"낭만 사랑니","word":"군불","meaning":"음식을 하기 위해서가 아니라 오로지 방을 덥히려고 아궁이에 때는 불","example":"그의 악행이 전해질 때마다 데이터로 된 군불이 일더니, 시사 고발 프로그램에 제보해야 한다는 여론까지 생겨났다.","note":"p.108"},{"book":"낭만 사랑니","word":"적산거리다","meaning":"지그시 힘을 주어 자꾸 누르다","example":"시린은 아직 눈물이 마르지 않은 눈두덩을 손가락으로 적산거리며 만장해 들은 얘기를 떠올렸다.","note":"p.179"},{"book":"낭만 사랑니","word":"치악력","meaning":"이빨로 무언가를 쥐거나 물어 뜯는 힘","example":"이때에는 눈앞에 뵈는 게 없을수록 치악력에 집중할 수 있다.","note":"p.204-205"},{"book":"낭만 사랑니","word":"직신거리다","meaning":"지그시 힘을 주어 자꾸 누르다","example":"시린은 아직 눈물이 마르지 않은 눈두덩이를 손가락으로 직신거리며 만정에게 들은 얘기를 떠올렸다.","note":"p.179"},{"book":"어떤 물질의 사랑","word":"지리멸렬하다","meaning":"이리저리 흩어지고 찢기어 갈피를 잡지 못하다","example":"나는 그 해 선망했던 물리학과에 무탈하게 입학한 후, 새롭지만 지리멸렬한 집단으로 섞여 들어갔다.","note":"p.16"},{"book":"시녀 이야기","word":"불문율","meaning":"사람들 사이에서 암묵적으로 지켜지고 있는 규칙","example":"불문율로 이미 전례가 있었다.","note":"p.33"},{"book":"시녀 이야기","word":"버늦되다","meaning":"사람이 어떤 곳에 버려져 궁상하게 되다","example":"진입로에서 우리 집이 버늦된 수단과 한 사람이 세차를 하고 있다.","note":"p.35"},{"book":"시녀 이야기","word":"목책","meaning":"말뚝 따위를 죽 잇따라 박아 만든 울타리","example":"우리는 첫 번째 목책에 다다른다.","note":"p.40"},{"book":"시녀 이야기","word":"노초","meaning":"성냥어 소리를 지름","example":"나는 끊어오르는 파도 같은 풍등과 노초를 듣고 깨어나려 한다.","note":"p.73"},{"book":"시녀 이야기","word":"경각","meaning":"눈 깜빡할 사이","example":"지금 당장 목숨이 경각에 달린 건 아니나, 당신에게 말하겠다.","note":"p.74"},{"book":"시녀 이야기","word":"소택지","meaning":"늪과 연못으로 둘러싸인 습한 땅","example":"늪 속으로, 소택지 속으로 침전하듯 내 몸 깊은 곳으로 가라앉는다.","note":"p.131"},{"book":"시녀 이야기","word":"성장","meaning":"잘 차려입음","example":"성장을 하고 당당하게 입장하시는 세레나 조이님일 것이다.","note":"p.199"},{"book":"시녀 이야기","word":"기치","meaning":"예전에 군대에서 쓰던 깃발","example":"이 구호 뒤로 다른 구호들이 씌어 있는 기치들도 보인다.","note":"p.208"},{"book":"시녀 이야기","word":"도해","meaning":"글의 내용을 그림으로 풀이함","example":"내 이 피부 위에 마치 지도처럼 불모의 도해가 되며, 어디로도 이어지지 않는 작은 길들이 지그재그로 교차하리라.","note":"p.249"},{"book":"시녀 이야기","word":"일익","meaning":"중요한 구실을 하는 한 부분","example":"전에는 내가 겪어야 하는 고통의 일익을 담당한 그녀를 단숨에 미워하면 되었다.","note":"p.227"},{"book":"시녀 이야기","word":"여늠은","meaning":"열이 조금 나는 수","example":"우리는 모두 기미를 끄고, 고개를 들어 그를 바라보며 방 안에 있던 직분들이 아마 여늠은 먹은 되었을 거야.","note":"p.304"},{"book":"시녀 이야기","word":"발다","meaning":"액체가 바싹 졸아서 말라붙다","example":"나라는 꽃과는 평소한 아이가 너무 발은 물에 넘고 가버려, 모래로 만든 여자에 지나지 않는다.","note":"p.396"},{"book":"시녀 이야기","word":"화끈하다","meaning":"견딜 수 없이 타는 불과 같이 매우 뜨겁다","example":"화끈한 마음이 파도처럼 우리를 휩쓸고 지나간다.","note":"p.483"},{"book":"시녀 이야기","word":"허허롭다","meaning":"텅 빈 느낌이 있다","example":"덧 쓰고 지우고 그 위에 다시 덧쓴 양피지의 글씨처럼 영영 들리지 않는 소리들이 겹겹이 포개져 있고, 스타일 위에 스타일이 겹치고, 나지막히 깔리는 드럼 소리, 허허로운 흐느낌, 휴지로 만든 꽃다발, 마분지로 만든 악마들, 춤추는 사람들 위로 빛의 눈발을 흩뿌리며 빙빙 돌아가는 유리의 공들.","note":"p.11-12"},{"book":"시녀 이야기","word":"선용하다","meaning":"알맞게 쓰거나 좋은 일에 쓰다","example":"여자들이 여가를 선용해 더 이상 쓸모가 없는 물건을 재활용해서 손수 만든, 고풍스러운 민속 공예.","note":"p.18"},{"book":"증언들","word":"초야","meaning":"결혼한 신랑과 신부가 처음으로 함께 자는 밤","example":"아이미지 초야를 보내더라도, 결국 조명등에 매달려 흔들리거나 집 안의 알약을 모조리 집어 삼키고 장미 덤불 속에서 혼수상태로 발견될 것이다.","note":"p.311"},{"book":"증언들","word":"불가결","meaning":"없어서는 아니 됨","example":"최초의 야곱의 아들로 비범한 신심의 소유자이고, 길리어드 공화국을 건국하기 위한 초기의 투쟁에서 불가결한 존재였대요.","note":"p.320"},{"book":"증언들","word":"고색창연","meaning":"오래되어 예스러운 풍취나 모습이 그윽함","example":"이 고색창연한 지하의 말들이 언제나 진실인 건 아니지만 가끔은 맞는다.","note":"p.361"},{"book":"증언들","word":"매무새","meaning":"옷을 입고 난 뒤의 모양새를 매만지는 뒷모양새","example":"긴릿빛 드레스와 하얀 목걸이를 걸치고 깔끔하고 단정한 매무새를 한 두 사람을 올려다보는데, 뭔가 말하거나 눈을 한 방울이 내 뺨을 타고 흘러내렸어요.","note":"p.35"},{"book":"증언들","word":"정서","meaning":"초 잡았던 글을 정식으로 베껴 씀","example":"힐데가르트 도서관에서 내가 맡은 임무 중에는 리디아 아주머니의 연설문을 정서하는 일이 있었다고 말씀드렸지요.","note":"p.434"},{"book":"증언들","word":"비슬거리다","meaning":"힘없이 자꾸 비틀거리다","example":"쟁여 둔 무연 화약을 끌고 길리어드의 코대 밑으로 이만큼 터널을 파들어왔는데, 여기서 비슬거릴 것인가?","note":"p.451"},{"book":"증언들","word":"전서구","meaning":"편지를 보내는 데 쓸 수 있게 훈련된 비둘기","example":"이제 나는 전서구가 된 거야.","note":"p.476-477"},{"book":"증언들","word":"모로","meaning":"옆쪽으로","example":"고개를 모로 꼬고, 미시멘고 선장이 말했어요.","note":"p.549"},{"book":"증언들","word":"사보타주","meaning":"노동 쟁의의 행위의 하나","example":"그로 인해 일어난 사회적 갈등과 혼란으로 말미암아 메이데이 저항 세력이 조직한 사보타주 운동","note":"p.587-588"},{"book":"증언들","word":"미망","meaning":"사리에 어두워 갈피를 잡지 못하고 헤맴","example":"하지만 나는 그저 미망에 빠져 있는지 모른다.","note":"p.14"},{"book":"증언들","word":"장광설","meaning":"쓸데없이 장황하게 늘어놓는 말","example":"이 장광설을 감시 카미라를 피해 은닉처에 숨겨둘 것이다.","note":"p.14"},{"book":"증언들","word":"조처하다","meaning":"제기된 문제나 일을 잘 정돈하여 처리하다","example":"이렇게 조처해두긴 했으나 여전히 내가 무릅쓰는 위험은 잘 안다.","note":"p.14"},{"book":"증언들","word":"흠결","meaning":"일정한 수효에서 부족함이 생김","example":"그리고 다른 곳이나 마찬가지로 길리어드에서도 많은 어른이 흠결이 있긴 해도 친절했지요.","note":"p.17"},{"book":"증언들","word":"넝마주이","meaning":"넝마나 헌 종이, 빈 병 따위를 주워 모으는 사람","example":"이건 자선단체에, 이건 넝마주이, 이건 '입을 수 있는 예술'로.","note":"p.62"},{"book":"증언들","word":"망망하다","meaning":"넓고 멀다","example":"바다처럼 망망해서, 밀려드는 옷감의 파도에 멜라니가 빠져 죽을 것 같았어요.","note":"p.62"},{"book":"증언들","word":"알곡","meaning":"쭉정이나 잡것이 섞이지 아니한 곡식","example":"내가 여자이므로, 이런 종류의 알곡 추려 내기에 특히 취약할 거라 짐작할지 모르나, 그건 오산일 공산이 높다.","note":"p.92"},{"book":"증언들","word":"공산","meaning":"어떤 상태가 되거나 어떤 일이 일어날 수 있는 확실성의 정도","example":"내가 여자이므로, 이런 종류의 알곡 추려 내기에 특히 취약할 거라 짐작할지 모르나, 그건 오산일 공산이 높다.","note":"p.92"},{"book":"증언들","word":"찬탈","meaning":"왕위, 국가 주권 따위를 억지로 빼앗음","example":"순전히 여성이라는 이유로 나는 잠재적 찬탈자의 명단에 이름이 오르지 않는다.","note":"p.92"},{"book":"증언들","word":"연극","meaning":"흔히 사람을 속이거나 놀리기 위하여 꾸미는 말이나 행동","example":"아르코아 출라 '는 본복 사이를 덮은 성긴 전대를 가르쳐서, 연극과 늘어진 전복까지 이마를 연극 등장식의 위엄같은 흰 가리운 오므면서, 이 화장을 어느 누구에게 속하게 될까 생각했다.","note":"p.93"},{"book":"증언들","word":"악화일로","meaning":"상태, 성질, 관계 따위가 자꾸 나쁘게 되어감","example":"사라진 나의 국가에서, 상황은 수년째 악화일로로 치닫고 있다.","note":"p.99"},{"book":"증언들","word":"비등점","meaning":"여론이나 열정 따위가 일어나 최고조에 달한 상태","example":"비등점으로 끓어오르던 몸만 내 걱정거리가 아니었어요.","note":"p.122"},{"book":"증언들","word":"신문","meaning":"알고 있는 사실을 캐어 물음","example":"계획안은 캐나다로 향하는 탈주 시녀들을 포획하는 데 필요한 정보를 개략적으로 제시하여 국가 비상사태 선포와 더불어 추적견의 수를 2배 늘리고 더욱 효율적인 신문 체계를 갖출 것을 요청했다.","note":"p.164"},{"book":"증언들","word":"일례","meaning":"한 번의 예","example":"“이 탈출 사명은 일례에 박멸해야 합니다.”","note":"p.165"},{"book":"증언들","word":"포치","meaning":"건물의 입구나 현관에 지붕을 갖추어 잠시 차를 대거나 사람들이 비를 피하도록 만든 곳","example":"묵직한 돌계단을 오르니 현관 포치였어요.","note":"p.186"},{"book":"증언들","word":"비어지다","meaning":"가려져 속에 있던 것이 밖으로 내밀어 나오다","example":"또 훌쩍훌쩍 울음이 비어져 나오려 했죠.","note":"p.187"},{"book":"증언들","word":"실연","meaning":"실제로 하여 보임","example":"한창 꾸역꾸역 실연되고 있는 폭압이란 얼마나 따분한가.","note":"p.210"},{"book":"증언들","word":"굴착거리다","meaning":"날카롭고 뾰족한 끝으로 바닥이나 거죽을 자꾸 문지르다","example":"어둠 속에서 귀퉁이로 굴착거리는 것, 그게 내게 예비된 계획이었다.","note":"p.216"},{"book":"증언들","word":"무위하다","meaning":"아무것도 하는 일이 없다","example":"무위한 나날을 보낸지 사흘째, 폴라는 하녀들을 시켜 내 방에 마분지 상자 몇 개를 갖다 놓았어요.","note":"p.230"},{"book":"증언들","word":"한담","meaning":"심심하거나 한가할 때 나누는 이야기","example":"거실에서 응대했는데, 그 남자가 아버지와 한담을 나누는 사이 베카는 말없이 앉아 있었는데 베카 말로는 그 남자를 보면 살갗에 벌레가 기어 다니는 느낌이 들었다고 해요.","note":"p.241"},{"book":"증언들","word":"데카당스","meaning":"19세기 말 프랑스와 영국 등 유럽에서 유행하였던 문화 현상. 병적인 감수성, 탐미적 경향, 전통의 부정 및 비도덕성 등이 특징이다","example":"우리는 여러분이, 여러분이 받은 특권적 수련으로, 우리가 현재 폐지하고 있는 데카당스하고 부패한 사회로 인해 초래된 여성들의 개탄한 운명을 개선하는 사업의 조역으로 적격이라고 보고 있습니다.","note":"p.255"},{"book":"증언들","word":"징발","meaning":"국가에서 특별한 일에 필요할 사람이나 물자를 강제로 모으거나 거둠","example":"우리가 징발한 과거의 대학 중 한 곳으로, 장벽이 둘러쳐진 부지 내에 있습니다.","note":"p.257"},{"book":"증언들","word":"궁핍하다","meaning":"목이 마른 듯이 몹시 곤궁하다","example":"궁핍한 편성이 없다면 우리에게 환상도, 구역의 음식을 남자가 넘겨주는 안 되고 우리의 방법으로 빠져 들어서도 안 됩니다.","note":"p.257"},{"book":"증언들","word":"저류","meaning":"겉으로 드러나지 아니하고 깊은 곳에서 일고 있는 움직임을 비유적으로 이르는 말","example":"우호를, 심지어 동료 간의 유대를 짐짓 가장하기는 했으나, 저변에서는 이미 적의의 저류가 흐르기 시작했다.","note":"p.258"},{"book":"증언들","word":"막후","meaning":"겉으로 드러나지 않는 뒷면","example":"아주머니들은 막후에서 일했어요.","note":"p.295"},{"book":"증언들","word":"착암기","meaning":"광산이나 토목 공사에서 바위에 구멍을 뚫는 기계","example":"나는 어둠을 틈타, 착암기와 펜치, 그리고 모르타르 땜질의 도움을 받아서, 배터리로 작동하는 감시 카메라 두 대를 내 석상의 받침대에 설치했다.","note":"p.301"},{"book":"증언들","word":"이엉","meaning":"초가집의 지붕이나 담을 이기 위하여 짚이나 새 따위로 엮은 물건","example":"비록 옆모습은 인상적이지만 걱정스러우리만큼 잔주름이 짜글짜글한 리즈 아주머니나 회색 이엉 같은 머리와 감자 포대 같은 몸을 지닌 나를 보고 흥분한 남자가 있다는 생각 자체가 워낙 웃겨서 말할 가치도 없지만 말이다.","note":"p.307"},{"book":"증언들","word":"괴까다롭다","meaning":"괴상하고 별스럽게 까다로운 데가 있다","example":"나는 어쩌면 비정상적으로 괴까다로운 여자 아이들을 약간 알았나.","note":"p.311"},{"book":"세상 모든 것의 기원","word":"근동","meaning":"유럽에 가까운 동양 여러 나라를 통틀어 이르는 말 (이집트, 이라크, 터키 등)","example":"근동 지역에서는 1만 5000년 전부터 야생에서 풍부하게 자라는 밀을 이용해 맥주를 만들었고, 이후 이집트 문명에서도 맥주를 널리 만들어 마셨다.","note":"p.21"},{"book":"세상 모든 것의 기원","word":"역참","meaning":"조선 시대에 있던 공공의 기별, 역마, 역원 등 여행 체계를 합쳐서 이르는 말","example":"거대한 제국이었던 몽골의 정복 활동과 역참으로 세계는 하나가 되었다.","note":"p.32"},{"book":"세상 모든 것의 기원","word":"질곡","meaning":"몹시 속박하여 자유를 가질 수 없는 고통의 상태","example":"지정학적으로 유라시아의 끝자락에 위치해서 유목 문화의 영향이 강하다는 점, 주변 강대국들의 침탈로 인한 질곡의 역사를 경험했다는 점 등이 그렇다.","note":"p.54"},{"book":"세상 모든 것의 기원","word":"벽사","meaning":"요사스러운 귀신을 물리침","example":"또한, 붉은 벼슬이 있어 악한 마귀를 쫓아내는 영물이자 벽사의 동물로도 생각되었다.","note":"p.68"},{"book":"세상 모든 것의 기원","word":"상서롭다","meaning":"복되고 길한 일이 일어날 조짐이 있다","example":"신화의 내용에서 알 수 있듯이 닭은 상서로운 기운을 전달해주는 매개체로 서술되었다.","note":"p.68"},{"book":"세상 모든 것의 기원","word":"호인","meaning":"만주 사람","example":"무용총의 <각저도>에는 고구려인과 서역에서 온 호인들이 격투하는 모습이 그려져 있다.","note":""},{"book":"세상 모든 것의 기원","word":"여염집","meaning":"일반 백성의 살림집","example":"하지만 이후에는 여염집 어린 아이도 비단 옷을 입었을 만큼 몽골 알타이 지역에서 비단이 널리 유행했다.","note":"p.191"},{"book":"세상 모든 것의 기원","word":"누대","meaning":"누각과 대사와 같이 높은 건물","example":"밤마다 전쟁의 여파로 산불이 날아오르던 조조는 순유의 말을 귀담아 듣고 곰곰 생각한 끝에 전사자들의 영혼을 위로하고 자신의 치적을 널리 알리기 위한 목적으로 거대한 누대를 짓는다.","note":"p.281"},{"book":"세상 모든 것의 기원","word":"천양지차","meaning":"하늘과 땅 사이와 같이 엄청난 차이","example":"물론, 공유도는 정보의 양으로 본다면 그때와 지금은 천양지차다.","note":"p.343"},{"book":"스파이와 배신자","word":"방첩","meaning":"간첩 활동을 막음","example":"KGB의 방첩 담당 부서 K부에서 이것은 일상적인 도청 작업이었다.","note":"p.15"},{"book":"스파이와 배신자","word":"해찰","meaning":"일에는 마음을 두지 아니하고 쓸데없이 다른 짓을 함","example":"그는 자신의 은밀한 임무를 <해찰>이라고 표현했다.","note":"p.76"},{"book":"스파이와 배신자","word":"벼리다","meaning":"마음이나 의지를 가다듬고 단련하여 강하게 하다","example":"그들 사이에는 비밀, 위험, 의리, 배신으로 벼려진 강렬한 유대가 있었다.","note":"p.159"},{"book":"스파이와 배신자","word":"성미롭다","meaning":"참을성이 없고 성질이 급하다","example":"1982년 중반 유럽 이민수는 불만 많고, 외롭고, 성미로운 사람으로 점점 굳어지고 있었다.","note":"p.201"},{"book":"스파이와 배신자","word":"광맥","meaning":"암석이 갈라진 틈에 유용 광물이 많이 묻혀 있는 부분","example":"그가 작성한 녹취록은 다양한 <고객들>을 위해 보고서를 캐낼 수 있는 광맥이 되었다.","note":"p.217"},{"book":"스파이와 배신자","word":"비망록","meaning":"잊지 않으려고 중요한 골자를 적어둔 것","example":"<영국의 정책에 대해 기본적으로 중요한 모든 측면과 영국 측 참가자들의 상세한 정보를 담은 심층 비망록을 작성했다.>","note":"p.305"},{"book":"스파이와 배신자","word":"불편부당","meaning":"아주 공평하여 어느 쪽으로도 치우침이 없음","example":"나는 불편부당해지려고 최선을 다했다.","note":"p.335"},{"book":"스파이와 배신자","word":"씩씩거리다","meaning":"숨이 차거나 성이 나서 매우 가쁘고 거친 숨소리를 자꾸 내다","example":"버스가 ... 빠져나가는 동안 그는 씩씩거리며 편안한 자세를 잡고 눈을 감았다.","note":"p.438"},{"book":"스파이와 배신자","word":"천양지차","meaning":"하늘과 땅 사이와 같이 엄청난 차이","example":"물론, 공여도는 정도의 양으로 본다면 그때와 지금은 천양지차다.","note":"p.343"},{"book":"네 이웃의 식탁","word":"응그리다","meaning":"험상궂게 찌푸리다","example":"웃거나 울거나 표정을 괴상하게 응그려 보이며 노래를 불러주거나 뭐가 됐든 최소한 눈을 맞춰 주어야 한다.","note":"p.31"},{"book":"네 이웃의 식탁","word":"양수겸장","meaning":"양쪽에서 동시에 하나를 노리게 됨을 비유적으로 이르는 말","example":"구체적인 질감은 물론 효용성마저 있는, 앉은자리에서 무언가 양수겸장을 하지 못할 바에는 반드시 선택할 수밖에 없는 대안의 언어였다.","note":"p.74"},{"book":"네 이웃의 식탁","word":"서름하다","meaning":"남과 가깝지 못하고 사이가 조금 서먹하다","example":"한밤중에 벌어진 충체적 난국에 개입한 이웃으로서 적절한 보상으로 전후사정을 낱낱이 들을 권리가 있다는 듯한 홍단희의 화법에 서름한 장벽을 느끼며 은오는 대답했다.","note":"p.116-117"},{"book":"네 이웃의 식탁","word":"의지가지없다","meaning":"의지할 만한 대상이 없다","example":"호젓하고 의지가지없는 소규모 공동주택으로 이사 와서만이 아니라, 약국에서 수많은 아픈 사람들을 대하는 동안 요진은 세상 모두를 손님으로 인정하고 접객을 할 수도 있을 것처럼 일상의 근육이 잡혀 있었다.","note":"p.119-120"},{"book":"네 이웃의 식탁","word":"휘갑을 치다","meaning":"뒤탈이 없도록 마무리하다","example":"아르바이트생 남자는 한숨을 쉬며, 어쨌든 빨리 안 보이게 해주세요, 정도의 소극적인 경고로 휘갑을 치곤 자리를 떴다.","note":"p.146"},{"book":"네 이웃의 식탁","word":"좌고우면","meaning":"이쪽저쪽을 돌아본다","example":"임부의 반색하는 모습은 곧 한 발 앞으로 내밀어 여자를 끌어안기라도 할 것처럼 보였으나, 아이 둘이 있어 양손이 자유롭지 않으므로 대신 좌고우면을 해 보이며 아이들에게 인사를 시켰다.","note":"p.183"},{"book":"네 이웃의 식탁","word":"섭생","meaning":"병에 걸리지 않도록 건강을 잘 관리함","example":"향후 몇 가구가 들고 나든지 변함없이 이 자리를 지키고 서 있을 것만 같은, 아웃 같은 따뜻한 나눔과 건전한 섭생의 결정체처럼.","note":"p.191"},{"book":"네 이웃의 식탁","word":"투레질","meaning":"젖먹이가 두 입술을 떨어 투루루 소리를 내는 것","example":"이런저런 그릇 소리에 이어서 말소리며 아이들의 투레질 소리 같은 것이 초저녁의 허공을 부유했다.","note":"p.9"},{"book":"네 이웃의 식탁","word":"도열","meaning":"많은 사람이 줄을 늘어섬","example":"비로소 알아차리고 요진은 도열한 일가 어르신들께 폐백 인사를 마친 신부의 기분으로 숨을 내쉬었다.","note":"p.10"},{"book":"네 이웃의 식탁","word":"매조지","meaning":"일의 끝을 단단히 맺어 마무리하는 일","example":"어쩌면 이야기를 매조지하려는 의도를 담아낸 것이지도 모르지만 홍단희는 좀 더 명확하게 물음의 추를 얹었다.","note":"p.11"},{"book":"네 이웃의 식탁","word":"공그르다","meaning":"실 끝이 겉으로 드러나지 않게 속으로 떠서 꿰매다","example":"이쪽에서 대략 공그르겠다는 티를 낸 것 같은데도 저쪽에서 굳이 알아야겠다면, 이런 부분은 처음부터 오해하지 않도록 분명히 해 두어야 한다는 것이 요진의 주관이었다.","note":"p.14"},{"book":"스파이와 배신자","word":"성마르다","meaning":"참을성이 없고 성질이 조급하다","example":"1982년 중반 무렵 에임스는 불만 많고, 외롭고, 성마른 사람으로 점점 굳어지고 있었다.","note":"p.201"},{"book":"스파이와 배신자","word":"씨근거리다","meaning":"숨이 차거나 성이 나서 매우 가쁘고 거친 숨소리를 자꾸 내다","example":"버스가 젤레노고르스크를 씨근거리며 빠져나가는 동안 고르디옙스키는 딱딱한 좌석에서 최대한 편안한 자세를 잡고 눈을 감았다.","note":"p.438"},{"book":"증언들","word":"매무시","meaning":"옷을 입고 나서 옷 입은 모양새를 매만지는 뒷마무리","example":"진줏빛 드레스와 하얀 목걸이를 걸치고 깔끔하고 단정한 매무시를 한 두 사람을 올려다보는데, 믿거나 말거나 눈물 한 방울이 내 뺨을 타고 흘러내렸어요.","note":"p.375"},{"book":"증언들","word":"열주","meaning":"줄지어 늘어선 기둥","example":"아르두아 홀과 '눈' 본부 사이를 덮은 성긴 잔디를 가로질러(약간 힘겹게) 열주가 늘어선 정문까지 이어지는 언덕 등성이의 위압적인 흰 계단을 오르면서, 이 회동은 어느 부류에 속하게 될까 생각했다.","note":"p.93"},{"book":"증언들","word":"일거","meaning":"한 번 움직임","example":"“이 탈주 사업은 일거에 박멸해야 합니다.”","note":"p.165"},{"book":"증언들","word":"갉작거리다","meaning":"날카롭고 뾰족한 끝으로 바닥이나 거죽을 자꾸 문지르다","example":"어둠 속에서 쥐처럼 갉작거리는 것, 그게 내게 예비된 계획이었다.","note":"p.216"},{"book":"증언들","word":"갈급하다","meaning":"목이 마른 듯이 몹시 조급하다","example":"갈급한 필요성이 없다면 우리에게 할당된 구역의 문지방을 남자가 넘어서는 안 되고 우리의 방법론을 따지고 들어서도 안 됩니다.","note":"p.257"},{"book":"증언들","word":"꾀까다롭다","meaning":"괴상하고 유난히 까다롭다","example":"나는 이처럼 비정상적으로 꾀까다로운 여자 애들을 익히 알았다.","note":"p.311"},{"book":"시녀 이야기","word":"배속되다","meaning":"사람이 어떤 곳에 배치되어 종사하게 되다","example":"진입로에서 우리 집에 배속된 수호자 한 사람이 세차를 하고 있다.","note":"p.35"},{"book":"시녀 이야기","word":"노호","meaning":"성내어 소리를 지름","example":"나는 끊어오르는 파도 같은 혼돈과 노호를 뚫고 깨어나려 한다.","note":"p.73"},{"book":"시녀 이야기","word":"여남은","meaning":"열이 조금 나는 수","example":"우리는 모두 기계를 끄고, 고개를 들어 그를 바라보며 방 안에 있던 직원들이 아마 여남은 명은 되었을 거다.","note":"p.304"},{"book":"시녀 이야기","word":"밭다","meaning":"액체가 바싹 졸아서 말라붙다","example":"나라는 존재는 경솔한 아이가 너무 발은 물가에 남기고 가버린, 모래로 만든 여자에 지나지 않는다.","note":"p.396"},{"book":"시녀 이야기","word":"화급하다","meaning":"걷잡을 수 없이 타는 불과 같이 매우 급하다","example":"화급한 마음이 파도처럼 우리를 휩쓸고 지나간다.","note":"p.482"},{"book":"증언들","word":"얽다","meaning":"얼굴에 우묵우묵한 마맛자국이 생기다","example":"우리의 날씬하거나 깡마르거나 뚱뚱한 다리, 우아하거나 앙상하거나 소시지 같은 팔, 복숭아 같거나 얽은 우리의 피부, 우리의 빛나는 고수머리나 거칠고 제멋대로 뻗치는 머리털이나 지푸라기처럼 볼품없이 땋은 머리나, 아무런 상관도 없어요.","note":"p.18"},{"book":"증언들","word":"고수머리","meaning":"고불고불하게 말려있는 머리털","example":"우리의 날씬하거나 깡마르거나 뚱뚱한 다리, 우아하거나 앙상하거나 소시지 같은 팔, 복숭아 같거나 얽은 우리의 피부, 우리의 빛나는 고수머리나 거칠고 제멋대로 뻗치는 머리털이나 지푸라기처럼 볼품없이 땋은 머리나, 아무런 상관도 없어요.","note":"p.18"},{"book":"빵충 사육 준수 사항","word":"적화","meaning":"꽃을 따는 일","example":"외모 지상주의 현장을 방불케하는 적화 작업에 돌입했다.","note":"p.41"},{"book":"빵충 사육 준수 사항","word":"수매","meaning":"거두어 사들임","example":"농림축산식품부에서는 현행 수매 제도가 곡물류, 쌀, 일부 농산물에만 한정되어 있고 곤충 단백질 류는 법적 수급 조절 대상이 아니기 때문에 공공 수매의 근거가 없다는 입장을 밝혔다.","note":"p.121"},{"book":"아침의 피아노","word":"비의적","meaning":"비밀스러운 종교 의식과 같은","example":"몸은 비의적인 것이다. 살아 있고 살려고 하기 때문이다.","note":"p.33"},{"book":"아침의 피아노","word":"범속","meaning":"평범하고 속됨","example":"범속한 동네의 무심한 오전마다 메시아는 도착하는 걸까.","note":"p.54"},{"book":"아침의 피아노","word":"홍소","meaning":"입을 크게 벌리고 웃거나 떠들썩하게 웃음","example":"침묵의 홍소, 이것이 존재인가.","note":"p.108"},{"book":"아침의 피아노","word":"구곡","meaning":"갈고리처럼 굽음","example":"그래서 나는 유년 시절부터 도서관의 책들과 구곡의 마음들 사이를 경계 없이 떠돌며 지적 영토들과 감성의 영토들을 정처 없이 주유했다.","note":"p.116"},{"book":"아침의 피아노","word":"주유","meaning":"두루 돌아다니면서 구경하며 놂","example":"그래서 나는 유년 시절부터 도서관의 책들과 구곡의 마음들 사이를 경계 없이 떠돌며 지적 영토들과 감성의 영토들을 정처 없이 주유했다.","note":"p.116"},{"book":"치유의 빛","word":"명현 현상","meaning":"장기간에 걸쳐 나빠진 건강이 호전되면서 나타나는 일시적 반응","example":"이건 일종의 명현 현상이에요.","note":"p.180"},{"book":"치유의 빛","word":"기전","meaning":"어떤 현상이 발생하고 진행되는 원리","example":"통증의 기전에 집착하지 마라.","note":"p.232"}];
const KEY="myLiteraryVocabulary_v6";
let DATA=DEFAULT_DATA.map(x=>({...x})), selected="전체", editing=-1;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function key(x){return x.book+"\u0000"+x.word}
try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(Array.isArray(saved)){
    const map=new Map(DEFAULT_DATA.map(x=>[key(x),{...x}]));
    saved.forEach(x=>{if(x&&x.book&&x.word)map.set(key(x),{...x})});
    DATA=[...map.values()];
  }
}catch(e){}
function books(){return [...new Set(DATA.map(x=>x.book))].sort((a,b)=>a.localeCompare(b,"ko"))}
function renderBooks(){
  const s=document.getElementById("bookSelect");
  s.innerHTML='<option value="전체">전체</option>'+books().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  s.value=selected;
  const b=document.getElementById("book");
  const current=b.value;
